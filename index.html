<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal & Compliance Command — Living Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1321;          /* near-black navy */
  --ink2:#1A2332;
  --paper:#FBFAF7;        /* warm ivory */
  --panel:#FFFFFF;
  --line:#E8E5DE;
  --line2:#D9D5CC;
  --gold:#B8933E;         /* legal gold */
  --gold-soft:#F7F1E3;
  --a:#2456E6;            /* command blue */
  --asoft:#EDF2FE;
  --red:#C6362E;--rsf:#FBEEED;--rbd:#EFC7C4;
  --amb:#B45309;--asf2:#FCF3E8;--abd:#EFD5B0;
  --grn:#1B7A44;--gsf:#EBF5EF;--gbd:#BFDECB;
  --purp:#6D28D9;--psf:#F3EFFB;
  --teal:#0E7490;--tsf:#E8F4F8;
  --t1:#0D1321;--t2:#3D4454;--t3:#8A8F9C;--t4:#B8BCC6;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:14px;--r2:11px;--r3:8px;--rpill:100px;
  --sh:0 1px 2px rgba(13,19,33,0.04),0 4px 16px rgba(13,19,33,0.05);
  --sh2:0 4px 12px rgba(13,19,33,0.08),0 16px 48px rgba(13,19,33,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--paper);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;}

/* ═══ LAYOUT ═══ */
.app{display:flex;height:100vh;}
aside.sb{width:232px;background:var(--ink);display:flex;flex-direction:column;flex-shrink:0;position:relative;}
aside.sb::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(184,147,62,0.4),transparent 40%);}
.sb-brand{padding:22px 20px 16px;display:flex;align-items:center;gap:11px;}
.sb-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8A6D2B);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:15px;color:#0D1321;letter-spacing:-0.02em;}
.sb-title{font-family:var(--serif);font-size:14.5px;color:#F5F2EA;line-height:1.2;font-weight:500;}
.sb-title small{display:block;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-top:2px;}
.sb-nav{flex:1;overflow-y:auto;padding:6px 12px 12px;}
.sb-nav::-webkit-scrollbar{width:3px;}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
.sb-label{font-size:8.5px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:rgba(245,242,234,0.28);padding:14px 8px 6px;}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:transparent;color:rgba(245,242,234,0.62);font-family:var(--sans);font-size:12.5px;font-weight:500;border-radius:8px;cursor:pointer;transition:all 0.13s;text-align:left;margin-bottom:1px;position:relative;}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:rgba(245,242,234,0.92);}
.nav-btn.on{background:rgba(184,147,62,0.14);color:#F5F2EA;font-weight:600;}
.nav-btn.on::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:var(--gold);}
.nav-btn svg{flex-shrink:0;opacity:0.8;}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:white;display:flex;align-items:center;justify-content:center;}
.nav-badge.gold{background:var(--gold);color:var(--ink);}
.sb-user{padding:13px 16px;border-top:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.13s;}
.sb-user:hover{background:rgba(255,255,255,0.04);}
.sb-uav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8A6D2B);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink);}
.sb-uname{font-size:12px;font-weight:600;color:rgba(245,242,234,0.9);}
.sb-urole{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;font-weight:700;margin-top:1px;}

main.mn{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:54px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;}
.tb-search{flex:1;max-width:420px;position:relative;}
.tb-search input{width:100%;padding:8px 13px 8px 34px;border:1.5px solid var(--line);border-radius:var(--rpill);font-family:var(--sans);font-size:12.5px;outline:none;background:var(--paper);transition:border 0.15s;}
.tb-search input:focus{border-color:var(--a);}
.tb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);}
.tb-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t3);padding:5px 12px;border-radius:var(--rpill);border:1px solid var(--line);cursor:pointer;transition:all 0.15s;}
.tb-status:hover{border-color:var(--line2);background:var(--paper);}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--t4);}
.tb-dot.ok{background:var(--grn);box-shadow:0 0 0 3px var(--gsf);}
.tb-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--rsf);}
.tb-dot.wait{background:var(--amb);box-shadow:0 0 0 3px var(--asf2);}
.mainbody{flex:1;overflow-y:auto;padding:26px 30px 60px;}
.mainbody::-webkit-scrollbar{width:8px;}
.mainbody::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;}

/* ═══ TYPE & CARDS ═══ */
.bc{margin-bottom:22px;}
.bc-crumb{font-size:9.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.bc-title{font-family:var(--serif);font-size:27px;font-weight:420;color:var(--t1);line-height:1.08;letter-spacing:-0.015em;}
.bc-title em{font-style:italic;font-weight:340;color:var(--gold);}
.bc-sub{font-size:12.5px;color:var(--t3);margin-top:6px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.card-t{font-family:var(--serif);font-size:15.5px;font-weight:500;color:var(--t1);}
.card-sub{font-size:11px;color:var(--t3);margin-left:auto;}
.card-body{padding:16px 18px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.mb-3{margin-bottom:12px;}.mb-4{margin-bottom:18px;}.mt-4{margin-top:18px;}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:var(--line);}
.kpi.rd::after{background:var(--red);}
.kpi.am::after{background:var(--amb);}
.kpi.gr::after{background:var(--grn);}
.kpi.au::after{background:var(--gold);}
.kpi.bl::after{background:var(--a);}
.kpi-label{font-size:9px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;}
.kpi-val{font-family:var(--serif);font-size:30px;font-weight:450;color:var(--t1);letter-spacing:-0.03em;line-height:1;}
.kpi-note{font-size:10.5px;color:var(--t3);margin-top:6px;}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:var(--rpill);font-size:9.5px;font-weight:700;letter-spacing:0.03em;}
.pill.rd{background:var(--rsf);color:var(--red);}
.pill.am{background:var(--asf2);color:var(--amb);}
.pill.gr{background:var(--gsf);color:var(--grn);}
.pill.au{background:var(--gold-soft);color:var(--gold);}
.pill.bl{background:var(--asoft);color:var(--a);}
.pill.gy{background:#F0EFEA;color:var(--t3);}
.pill.pu{background:var(--psf);color:var(--purp);}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r3);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:all 0.14s;border:1.5px solid transparent;}
.btn-prim{background:var(--ink);color:#F5F2EA;}
.btn-prim:hover{background:#1E293E;}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{background:#A5832F;}
.btn-sec{background:var(--panel);border-color:var(--line2);color:var(--t1);}
.btn-sec:hover{border-color:var(--t4);background:var(--paper);}
.btn-ghost{background:transparent;color:var(--t3);padding:5px 9px;}
.btn-ghost:hover{color:var(--t1);background:var(--paper);}
.btn-sm{padding:5px 11px;font-size:11.5px;}

.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:9px 14px;text-align:left;font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--line);background:var(--paper);}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.click{cursor:pointer;transition:background 0.12s;}
.tbl tr.click:hover{background:var(--paper);}
.mono{font-family:var(--mono);font-size:11px;}
.empt{padding:36px;text-align:center;color:var(--t3);font-size:13px;font-style:italic;}

/* ═══ EMAIL TRIAGE ═══ */
.mail-row{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.12s;align-items:flex-start;}
.mail-row:hover{background:var(--paper);}
.mail-row.unread{background:linear-gradient(90deg,var(--asoft) 0,transparent 60px);}
.mail-row.unread .mail-subj{font-weight:700;}
.mail-cat{width:3.5px;border-radius:2px;align-self:stretch;flex-shrink:0;}
.mail-main{flex:1;min-width:0;}
.mail-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.mail-from{font-size:12.5px;font-weight:600;color:var(--t1);}
.mail-time{font-size:10.5px;color:var(--t4);margin-left:auto;font-family:var(--mono);}
.mail-subj{font-size:13px;color:var(--t1);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-snip{font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mail-ai{font-size:11px;color:var(--t2);background:var(--gold-soft);border-left:2.5px solid var(--gold);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:7px;line-height:1.55;}
.risk-flag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;padding:2px 8px;border-radius:var(--rpill);letter-spacing:0.05em;}

/* ═══ MODAL & TOAST ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(13,19,33,0.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh2);width:min(680px,92vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;animation:mIn 0.2s cubic-bezier(0.2,0.9,0.3,1.2);}
@keyframes mIn{from{opacity:0;transform:translateY(14px) scale(0.98);}to{opacity:1;transform:none;}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.modal-t{font-family:var(--serif);font-size:16.5px;font-weight:500;flex:1;}
.modal-x{width:28px;height:28px;border-radius:50%;border:none;background:var(--paper);color:var(--t3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-x:hover{background:var(--line);color:var(--t1);}
.modal-b{padding:18px 20px;overflow-y:auto;flex:1;}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--paper);}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#F5F2EA;padding:11px 22px;border-radius:var(--rpill);font-size:12.5px;font-weight:500;box-shadow:var(--sh2);transition:transform 0.3s cubic-bezier(0.2,0.9,0.3,1.2);z-index:200;max-width:80vw;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ═══ PAGE ANIM ═══ */
.page-anim{animation:pIn 0.24s ease;}
@keyframes pIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

/* ═══ CONNECT CARDS ═══ */
.conn-card{border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start;transition:border 0.15s;}
.conn-card.ok{border-color:var(--gbd);background:linear-gradient(135deg,var(--gsf) 0%,var(--panel) 45%);}
.conn-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}

/* ═══ CERT TIMELINE ═══ */
.cert-lane{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.cert-home{width:110px;font-family:var(--serif);font-size:12.5px;flex-shrink:0;}
.cert-track{flex:1;display:flex;gap:4px;}
.cert-chip{flex:1;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;letter-spacing:0.04em;cursor:pointer;transition:transform 0.12s;color:white;text-transform:uppercase;}
.cert-chip:hover{transform:scale(1.05);}

/* ═══ EA BRIEF ═══ */
.brief-strip{background:linear-gradient(135deg,var(--ink) 0%,#1D2940 100%);border-radius:var(--r);padding:20px 24px;color:#F5F2EA;position:relative;overflow:hidden;}
.brief-strip::after{content:'§';position:absolute;right:24px;top:-14px;font-family:var(--serif);font-size:110px;color:rgba(184,147,62,0.12);font-style:italic;}
.brief-label{font-size:9px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.brief-text{font-size:13.5px;line-height:1.75;color:rgba(245,242,234,0.88);max-width:820px;}



/* ═══ AI DOCK — assistant on every page ═══ */
#dockBtn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#8A6D2B);border:none;cursor:pointer;box-shadow:0 6px 24px rgba(184,147,62,0.45);z-index:90;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:23px;color:var(--ink);transition:transform 0.15s;}
#dockBtn:hover{transform:scale(1.07);}
#dock{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(13,19,33,0.14);z-index:95;display:flex;flex-direction:column;transform:translateX(105%);transition:transform 0.26s cubic-bezier(0.2,0.9,0.3,1);}
#dock.open{transform:none;}
.dock-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--ink);}
.dock-h .dock-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#8A6D2B);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:var(--ink);}
.dock-title{font-family:var(--serif);font-size:14px;color:#F5F2EA;flex:1;}

/* ═══ ACCESS GATE ═══ */
#gate{position:fixed;inset:0;background:var(--ink);z-index:1000;display:flex;align-items:center;justify-content:center;}
.gate-box{text-align:center;max-width:340px;padding:20px;}
.gate-mark{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#8A6D2B);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:24px;color:#0D1321;margin:0 auto 18px;}
.gate-title{font-family:var(--serif);font-size:19px;color:#F5F2EA;margin-bottom:4px;}
.gate-sub{font-size:11px;color:rgba(245,242,234,0.4);letter-spacing:0.14em;text-transform:uppercase;font-weight:700;margin-bottom:22px;}
.gate-in{width:100%;padding:12px 16px;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#F5F2EA;font-family:var(--sans);font-size:14px;outline:none;text-align:center;letter-spacing:0.08em;transition:border 0.2s;}
.gate-in:focus{border-color:var(--gold);}
.gate-in.shake{animation:gShake 0.4s;border-color:var(--red);}
@keyframes gShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.gate-hint{font-size:10.5px;color:rgba(245,242,234,0.3);margin-top:14px;}

@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr;}.grid-3{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="gate-mark">§</div>
    <div class="gate-title">Legal &amp; Compliance Command</div>
    <div class="gate-sub">Living Horizon · Private</div>
    <input type="password" class="gate-in" id="gateIn" placeholder="Access code" autofocus
      onkeydown="if(event.key==='Enter')gateCheck()">
    <div class="gate-hint">Authorised access only</div>
  </div>
</div>
<div class="app">
<aside class="sb">
  <div class="sb-brand">
    <div class="sb-mark">§</div>
    <div class="sb-title">Legal &amp; Compliance<small>Command · Living Horizon</small></div>
  </div>
  <nav class="sb-nav">
    <div class="sb-label">Command</div>
    <button class="nav-btn" data-pg="assistant" onclick="nav('assistant')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Assistant
      <span class="nav-badge gold" style="display:flex;">AI</span>
    </button>
    <button class="nav-btn" data-pg="myboard" onclick="nav('myboard')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      My Board
      <span class="nav-badge" id="badgeBoard" style="display:none;">0</span>
    </button>
    <button class="nav-btn on" data-pg="dash" onclick="nav('dash')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Command Deck
    </button>
    <button class="nav-btn" data-pg="brief" onclick="nav('brief')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Morning Brief
    </button>
    <div class="sb-label">Inbox Intelligence</div>
    <button class="nav-btn" data-pg="inbox" onclick="nav('inbox')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Triage Queue
      <span class="nav-badge" id="badgeInbox" style="display:none;">0</span>
    </button>
    <button class="nav-btn" data-pg="drafts" onclick="nav('drafts')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Drafted Replies

async function gateCheck() {
  const v = document.getElementById('gateIn')?.value || '';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  const hex = [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  if (hex === GATE_HASH) {
    localStorage.setItem('lc_gate_until', String(Date.now() + 30 * 24 * 60 * 60 * 1000));

  } else {
    const el = document.getElementById('gateIn');

  }
}

// ── MONDAY.COM API — direct GraphQL from browser ──────────────
async function mondayQuery(query, variables) {
  if (!CONN.mondayToken) throw new Error('Monday.com not connected');
  const res = await fetch(MONDAY_CONFIG.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': CONN.mondayToken,
      'API-Version': '2024-10',
    },
    body: JSON.stringify({ query, variables: variables || {} }),
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0]?.message || 'Monday API error');
  return data.data;
}

// Fetch a board's items with column values

function gmailRequestToken() {
  if (!window.google?.accounts?.oauth2) {
    // Load GIS script on demand
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => gmailRequestToken();
    s.onerror = () => toast('Could not load Google sign-in — check connection');
    document.head.appendChild(s);
    return;
  }
  _gisClient = google.accounts.oauth2.initTokenClient({
    client_id: CONN.googleClientId,
    scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify',
    callback: (resp) => {
      if (resp.access_token) {
        localStorage.setItem('lc_gmail_token_exp', String(Date.now() + ((resp.expires_in || 3300) - 300) * 1000));
        CONN.gmailToken = resp.access_token;
        localStorage.setItem('lc_gmail_granted', '1');
        updateConnDots();
        scheduleGmailRefresh();
        toast('Gmail connected ✓ — scanning inbox…');
        gmailScan();
      }
    },
  });
  _gisClient.requestAccessToken();
}

// ── Silent session renewal — sign in once, stay signed in ─────
let _gmailRefreshTimer = null;

function ensureGis(cb) {
  if (window.google?.accounts?.oauth2) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = cb;
  s.onerror = () => {};
  document.head.appendChild(s);
}

function scheduleGmailRefresh() {
  if (_gmailRefreshTimer) clearTimeout(_gmailRefreshTimer);
  const exp = parseInt(localStorage.getItem('lc_gmail_token_exp') || '0', 10);
  if (!exp) return;
  // Renew 4 minutes before expiry (minimum 20s from now)
  const inMs = Math.max(exp - Date.now() - 4 * 60 * 1000, 20000);
  _gmailRefreshTimer = setTimeout(() => { silentGmailRefresh(); }, inMs);
}

function silentGmailRefresh() {
  return new Promise((resolve) => {
    if (!CONN.googleClientId || !localStorage.getItem('lc_gmail_granted')) { resolve(false); return; }
    let settled = false;
    const done = (ok) => { if (!settled) { settled = true; resolve(ok); } };
    setTimeout(() => done(false), 9000);
    ensureGis(() => {
      try {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: CONN.googleClientId,
          scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify',
          callback: (resp) => {
            if (resp.access_token) {
              localStorage.setItem('lc_gmail_token_exp', String(Date.now() + ((resp.expires_in || 3300) - 300) * 1000));
              CONN.gmailToken = resp.access_token;
              updateConnDots();
              scheduleGmailRefresh();
              done(true);
            } else done(false);
          },
          error_callback: () => done(false),
        });
        // prompt:'' = renew silently in the background, no popup, no click
        client.requestAccessToken({ prompt: '' });
      } catch (e) { done(false); }
    });
  });
}

async function gmailApi(path, opts) {
  if (!CONN.gmailToken) throw new Error('Gmail not connected');
  const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + CONN.gmailToken, 'Content-Type': 'application/json', ...(opts?.headers || {}) },
  });
  if (res.status === 401) {
    CONN.gmailToken = null; updateConnDots();
    // Permanent-setup users: renew silently and retry — no interruption
    if (CONN.googleClientId && localStorage.getItem('lc_gmail_granted') && !(opts && opts._retried)) {
      const ok = await silentGmailRefresh();
      if (ok) return gmailApi(path, Object.assign({}, opts, { _retried: true }));
    }
    openModal('Gmail session expired', `
      <div style="font-size:13px;line-height:1.8;color:var(--t2);">
        Quick-connect tokens last about an hour. Renewing takes two clicks:
        <ol style="margin:10px 0 0 20px;line-height:2;">

    throw new Error('Gmail session expired');
  }
  return res.json();
}

// Pull recent inbox messages, parse headers + snippet
async function gmailScan(maxResults = 30) {
  try {
    const list = await gmailApi(`messages?maxResults=${maxResults}&labelIds=INBOX`);
    if (!list.messages) { toast('Inbox empty or unreadable'); return; }
    const known = new Set(EMAILS.map(e => e.id));
    const newIds = list.messages.filter(m => !known.has(m.id)).slice(0, 25);
    let added = 0;
    for (const m of newIds) {
      const full = await gmailApi(`messages/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`);
      const h = n => full.payload?.headers?.find(x => x.name === n)?.value || '';
      const email = {
        id: m.id,
        threadId: full.threadId,
        from: h('From'),
        fromName: (h('From').match(/^([^<]+)</) || [,h('From')])[1].trim().replace(/"/g,''),
        subject: h('Subject') || '(no subject)',
        date: h('Date') ? new Date(h('Date')).toISOString() : new Date().toISOString(),
        snippet: full.snippet || '',
        read: !(full.labelIds || []).includes('UNREAD'),
        archived: false,
        cat: null, risk: null, aiSummary: null, suggestedAction: null,
      };
      classifyEmailLocal(email);
      EMAILS.unshift(email);
      added++;
    }
    EMAILS.sort((a,b) => new Date(b.date) - new Date(a.date));
    persist(); updateBadges();
    logActivity('gmail_scan', { added });
    toast(`Inbox scanned — ${added} new message${added===1?'':'s'} triaged ✓`);
    if (CONN.aiKey && added > 0) aiTriageBatch();
    if (curPage === 'inbox' || curPage === 'dash') render();
  } catch (e) {
    toast('Gmail scan failed: ' + e.message);
  }
}

// Rule-based instant classification (no AI needed)
function classifyEmailLocal(email) {
  const t = (email.from + ' ' + email.subject + ' ' + email.snippet).toLowerCase();
  if (/cqc|care quality|inspector|regulat|notice of|enforcement/.test(t)) email.cat = 'cqc';
  else if (/safeguard|allegation|abuse|police|s42|section 42/.test(t)) email.cat = 'safeguard';
  else if (/solicitor|legal|contract|lease|dispute|claim|litigation|tribunal|settlement|barrister/.test(t)) email.cat = 'legal';
  else if (/council|commissioner|local authority|procurement|tender|framework|brokerage|placement/.test(t)) email.cat = 'la';
  else if (/certificat|gas safety|eicr|legionella|fire risk|audit|policy|dbs|compliance/.test(t)) email.cat = 'compliance';
  else if (/candidate|interview|recruit|cv|onboard|induction|training|staff|hr|payroll|sickness|disciplinary|grievance/.test(t)) email.cat = 'hr';
  else if (/invoice|payment|rent|housing benefit|hb claim|remittance|statement/.test(t)) email.cat = 'finance';
  else if (/maintenance|repair|boiler|leak|rota|shift/.test(t)) email.cat = 'ops';
  else email.cat = 'info';

  // Risk scoring
  if (/urgent|immediate|deadline|final notice|enforcement|breach|overdue|escalat|legal action|without prejudice/.test(t)) {
    email.risk = email.cat === 'cqc' || email.cat === 'safeguard' || email.cat === 'legal' ? 'critical' : 'high';
  } else if (email.cat === 'cqc' || email.cat === 'safeguard') {
    email.risk = 'high';
  } else if (/reminder|expir|due|review required|action required/.test(t)) {
    email.risk = 'medium';
  } else email.risk = 'low';
}

// AI triage — deep categorisation, summary, suggested action
async function aiTriageBatch() {
  const untriaged = EMAILS.filter(e => !e.aiSummary && !e.archived).slice(0, 10);
  if (!untriaged.length || !CONN.aiKey) return;
  for (const email of untriaged) {
    try {
      const prompt = `You are the executive assistant to the Head of Legal & Compliance at Living Horizon, a CQC-regulated supported living provider (8 homes, sister landlord company Brunel Management). Analyse this email and respond ONLY with JSON, no markdown:
{"category":"cqc|legal|la|compliance|hr|safeguard|finance|ops|info","risk":"critical|high|medium|low","summary":"one sharp sentence on what this is and why it matters","action":"the single next action Nasir should take, imperative voice","monday_push":true/false,"monday_board":"complianceActions|candidates|onboarding|complaints|sharedTasks|null","draft_needed":true/false}

Email:
From: ${email.from}
Subject: ${email.subject}
Preview: ${email.snippet}`;
      const out = await aiCall(prompt, null, 300);
      if (out) {
        const j = JSON.parse(out.replace(/```json|```/g, '').trim());
        email.cat = j.category || email.cat;
        email.risk = j.risk || email.risk;
        email.aiSummary = j.summary;
        email.suggestedAction = j.action;
        email.mondayPush = j.monday_push ? (j.monday_board || 'sharedTasks') : null;
        email.draftNeeded = !!j.draft_needed;
        if (j.risk === 'critical' || j.risk === 'high') addRiskFromEmail(email);
      }
    } catch (e) { /* per-email AI failure is fine */ }
  }
  persist(); updateBadges();
  if (curPage === 'inbox' || curPage === 'dash') render();
}

function addRiskFromEmail(email) {
  if (RISK_REGISTER.find(r => r.emailId === email.id)) return;
  RISK_REGISTER.unshift({
    id: 'rk_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    emailId: email.id,
    ts: new Date().toISOString(),
    severity: email.risk,
    source: 'inbox',
    title: email.subject,
    detail: email.aiSummary || email.snippet,
    action: email.suggestedAction || 'Review and respond',
    resolved: false,
  });
  persist();
}

// ── AI ENGINE ─────────────────────────────────────────────────
async function aiCall(prompt, system, maxTokens) {
  if (!CONN.aiKey) return null;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CONN.aiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: AI_MODEL,
        max_tokens: maxTokens || 800,
        ...(system ? { system } : {}),
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    const d = await res.json();
    return d.content?.map(b => b.text || '').join('') || null;
  } catch (e) { return null; }
}

// Detect certificate risks from cached board data
function scanCertRisks() {
  const certs = BOARD_CACHE.certs?.items || [];
  certs.forEach(c => {
    const d = daysUntil(c.expiry);
    const isRisk = (c.renewal === 'OVERDUE' || c.renewal === 'MISSING — no record' || (d !== null && d < 14));
    if (isRisk && !RISK_REGISTER.find(r => r.certId === c.id && !r.resolved)) {
      RISK_REGISTER.unshift({
        id: 'rk_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        certId: c.id,
        ts: new Date().toISOString(),
        severity: c.renewal === 'OVERDUE' || (d !== null && d < 0) ? 'critical' : 'high',
        source: 'certificates',
        title: `${c.group?.title || ''} — ${c.certType || c.name}`,
        detail: c.renewal === 'MISSING — no record' ? 'No certificate on record' : `Expires ${fD(c.expiry)}${d !== null ? ` (${d < 0 ? Math.abs(d)+' days overdue' : d+' days'})` : ''}`,
        action: c.renewal === 'MISSING — no record' ? 'Locate or commission this certificate' : 'Book renewal now',
        resolved: false,
      });
    }
  });
  persist();
}

  const critical = EMAILS.filter(e => (e.risk === 'critical' || e.risk === 'high') && !e.archived);
  const risks = RISK_REGISTER.filter(r => !r.resolved);
  const certs = BOARD_CACHE.certs?.items || [];
  const certsOverdue = certs.filter(c => c.renewal === 'OVERDUE' || (daysUntil(c.expiry) !== null && daysUntil(c.expiry) < 0));
  const certsDue = certs.filter(c => { const d = daysUntil(c.expiry); return d !== null && d >= 0 && d < 30; });
  const comp = BOARD_CACHE.compliance?.items || [];
  const compOpen = comp.filter(i => i.status !== 'Done');
  const compCritical = compOpen.filter(i => i.priority === 'Critical');
  const notVerified = [...certs, ...comp].filter(i => !i.verifiedHow || i.verifiedHow === 'NOT VERIFIED — assumption');
  const pendingSync = SYNC_QUEUE.filter(s => s.status === 'pending');
  const nothingConnected = !CONN.gmailToken && !CONN.mondayToken && !CONN.aiKey;

  m.innerHTML = bc('Command', `Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 18 ? 'afternoon' : 'evening'}, <em>Nasir</em>`,
    new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })) +

  (nothingConnected ? `
    <div class="card mb-4" style="border-color:var(--gold);background:linear-gradient(135deg,var(--gold-soft),var(--panel) 60%);">
      <div class="card-body" style="display:flex;gap:16px;align-items:center;">
        <div style="font-size:30px;">⚡</div>
        <div style="flex:1;">
          <div style="font-family:var(--serif);font-size:16px;margin-bottom:4px;">Bring the Command online</div>
          <div style="font-size:12.5px;color:var(--t2);">Connect Gmail, Monday.com and the AI engine to activate inbox triage, board sync and the morning brief. Takes about five minutes.</div>
        </div>
        <button class="btn btn-prim" onclick="nav('connect')">Set up connections →</button>

    </div>` : '') +

  `<div class="grid-4 mb-4">
    <div class="kpi ${critical.length ? 'rd' : 'gr'}" style="cursor:pointer;" onclick="nav('inbox')">
      <div class="kpi-label">Needs attention</div>
      <div class="kpi-val">${critical.length}</div>
      <div class="kpi-note">${unread.length} unread in triage</div>
    </div>
    <div class="kpi ${certsOverdue.length ? 'rd' : certsDue.length ? 'am' : 'gr'}" style="cursor:pointer;" onclick="nav('certs')">
      <div class="kpi-label">Certificates</div>
      <div class="kpi-val">${certsOverdue.length ? certsOverdue.length : certsDue.length}</div>
      <div class="kpi-note">${certsOverdue.length ? 'overdue / missing' : 'due within 30 days'}</div>
    </div>
    <div class="kpi ${compCritical.length ? 'rd' : compOpen.length ? 'am' : 'gr'}" style="cursor:pointer;" onclick="nav('compliance')">
      <div class="kpi-label">Compliance actions</div>
      <div class="kpi-val">${compOpen.length}</div>
      <div class="kpi-note">${compCritical.length} critical priority</div>
    </div>
    <div class="kpi ${notVerified.length > 5 ? 'am' : 'au'}" style="cursor:pointer;" onclick="nav('verify')">
      <div class="kpi-label">Unverified claims</div>
      <div class="kpi-val">${notVerified.length}</div>
      <div class="kpi-note">evidence ledger sweep</div>
    </div>
  </div>` +

  `<div class="grid-2 mb-4" style="grid-template-columns:1.6fr 1fr;">
    <div class="card">
      <div class="card-h"><div class="card-t">Priority triage</div>
        <div class="card-sub">${CONN.gmailToken ? 'live inbox' : 'connect Gmail to activate'}</div>
        <button class="btn btn-ghost btn-sm" onclick="nav('inbox')">All mail →</button>
      </div>
      ${critical.length ? critical.slice(0, 6).map(e => mailRow(e, true)).join('') :
        `<div class="empt">${CONN.gmailToken ? 'Nothing critical right now — inbox is calm' : gmailNeedsOneClick() ? '<button class="btn btn-prim btn-sm" onclick="gmailRequestToken()">▶ Resume Gmail — one click, no password</button>' : 'Connect Gmail in Connections to begin monitoring'}</div>`}
    </div>
    <div>
      <div class="card mb-3">
        <div class="card-h"><div class="card-t">Risk radar</div><button class="btn btn-ghost btn-sm" onclick="nav('risk')">→</button></div>
        ${risks.length ? risks.slice(0, 4).map(r => `
          <div style="padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;">
            <span class="pill ${r.severity === 'critical' ? 'rd' : r.severity === 'high' ? 'am' : 'gy'}" style="margin-top:1px;">${r.severity}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.title)}</div>
              <div style="font-size:10.5px;color:var(--t3);margin-top:1px;">${esc(r.detail || '').substring(0, 70)}</div>
            </div>

      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">Monday.com pulse</div><button class="btn btn-ghost btn-sm" onclick="nav('boards')">→</button></div>
        <div class="card-body" style="padding:12px 16px;">
          ${CONN.mondayToken ? `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;"><span style="color:var(--t3);">Compliance actions open</span><strong>${compOpen.length}</strong></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;"><span style="color:var(--t3);">Certificates tracked</span><strong>${certs.length}</strong></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;"><span style="color:var(--t3);">Candidates in pipeline</span><strong>${(BOARD_CACHE.candidates?.items || []).length}</strong></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;"><span style="color:var(--t3);">Onboarding in progress</span><strong>${(BOARD_CACHE.onboarding?.items || []).length}</strong></div>

        </div>
      </div>
    </div>
  </div>` +

  (OVERSIGHT_CACHE.lastSync ? (function(){ const o = computeOversight(); const worst = o.boards.filter(b => b.exceptions.length).slice(0, 4);
    return `<div class="card mb-4">
      <div class="card-h"><div class="card-t">Execution watch</div>
        <div class="card-sub">${o.totals.overdue} overdue · ${o.totals.stuck} stuck · ${o.totals.unassigned} unowned · ${o.totals.stale} quiet</div>
        <button class="btn btn-ghost btn-sm" onclick="nav('oversight')">Full oversight →</button>
      </div>
      ${worst.length ? worst.map(b => `<div style="padding:9px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12px;cursor:pointer;" onclick="nav('oversight',{area:'${b.area}'})">
        <span style="font-family:var(--serif);font-weight:600;color:${b.score>=85?'var(--grn)':b.score>=60?'var(--amb)':'var(--red)'};min-width:32px;">${b.score}</span>
        <strong style="flex:1;">${esc(b.name)}</strong>
        <span style="color:var(--t3);">${b.exceptions.length} exception${b.exceptions.length===1?'':'s'}</span>
      </div>`).join('') : '<div class="empt" style="padding:14px;">Everything is being done ✓</div>'}
    </div>`; })() : '') +
  `<div class="card">
    <div class="card-h"><div class="card-t">Certificate horizon — all eight homes</div><button class="btn btn-ghost btn-sm" onclick="nav('certs')">Full planner →</button></div>
    <div class="card-body">${certLanes(certs)}</div>
  </div>`;
}

function mailRow(e, compact) {
  const cat = MAIL_CATS[e.cat] || MAIL_CATS.info;
  return `<div class="mail-row ${e.read ? '' : 'unread'}" onclick="openMail('${e.id}')">
    <div class="mail-cat" style="background:${cat.color};"></div>
    <div class="mail-main">
      <div class="mail-top">
        <span class="mail-from">${esc(e.fromName || e.from)}</span>
        <span class="pill" style="background:${cat.color}18;color:${cat.color};">${cat.label}</span>
        ${e.risk === 'critical' ? '<span class="risk-flag" style="background:var(--rsf);color:var(--red);">⚠ CRITICAL</span>' :
          e.risk === 'high' ? '<span class="risk-flag" style="background:var(--asf2);color:var(--amb);">HIGH</span>' : ''}
        <span class="mail-time">${relTime(e.date)}</span>
      </div>
      <div class="mail-subj">${esc(e.subject)}</div>
      ${!compact ? `<div class="mail-snip">${esc(e.snippet)}</div>` : ''}
      ${e.aiSummary ? `<div class="mail-ai"><strong>§</strong> ${esc(e.aiSummary)}${e.suggestedAction ? ` <em style="color:var(--gold);">→ ${esc(e.suggestedAction)}</em>` : ''}</div>` : ''}
    </div>
  </div>`;
}

function certLanes(certs) {
  if (!certs.length) return `<div class="empt">Connect Monday.com and run a full scan to load the certificate register</div>`;
  const byHome = {};
  HOMES.forEach(h => byHome[h] = []);
  certs.forEach(c => {
    const home = HOMES.find(h => (c.group?.title || '').toLowerCase().includes(h.toLowerCase()));
    if (home) byHome[home].push(c);
  });
  return HOMES.map(home => {
    const items = byHome[home];
    if (!items.length) return `<div class="cert-lane"><div class="cert-home">${home}</div><div style="font-size:11px;color:var(--t4);font-style:italic;">no certificates loaded</div></div>`;
    return `<div class="cert-lane">
      <div class="cert-home">${home}</div>
      <div class="cert-track">${items.slice(0, 8).map(c => {
        const d = daysUntil(c.expiry);
        const color = c.renewal === 'OVERDUE' || (d !== null && d < 0) ? 'var(--red)' :
          c.renewal === 'MISSING — no record' ? '#8A8F9C' :
          d !== null && d < 30 ? 'var(--amb)' :
          c.renewal === 'Booked' ? 'var(--purp)' : 'var(--grn)';
        const label = (c.certType || c.name || '').replace('Gas Safety (CP12)','GAS').replace('EICR (electrical)','EICR').replace('Fire Risk Assessment','FRA').replace('Emergency Lighting','EM-L').replace('Fire Alarm Testing','ALARM').replace('PAT Testing','PAT').replace('Legionella','LEG').substring(0, 6);
        return `<div class="cert-chip" style="background:${color};" title="${esc(c.certType || c.name)} — ${c.renewal || ''} ${c.expiry ? '· expires ' + fD(c.expiry) : ''}" onclick="openCert('${c.id}')">${label}</div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

function renderBrief(m) {
  const saved = localStorage.getItem('lc_brief_' + new Date().toDateString());
  m.innerHTML = bc('Executive Assistant', 'Morning <em>Brief</em>', 'Your day, distilled — inbox, boards, certificates and risk in one page') +
  `<div class="brief-strip mb-4">
    <div class="brief-label">§ Briefing — ${new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</div>
    <div class="brief-text" id="briefText">${saved ? saved : (CONN.aiKey ? 'Press <strong>Generate</strong> to compile today\'s briefing from your live inbox, Monday.com boards, certificate register and risk radar.' : 'Connect the AI engine in Connections to unlock the daily brief.')}</div>
    <div style="margin-top:14px;display:flex;gap:8px;">

function briefAgenda() {
  const critical = EMAILS.filter(e => (e.risk === 'critical' || e.risk === 'high') && !e.archived && !e.read);
  const certs = (BOARD_CACHE.certs?.items || []).filter(c => { const d = daysUntil(c.expiry); return c.renewal === 'OVERDUE' || (d !== null && d < 30); });
  const comp = (BOARD_CACHE.compliance?.items || []).filter(i => i.status !== 'Done' && (i.priority === 'Critical' || i.priority === 'High'));
  const overdueDue = comp.filter(i => i.due && daysUntil(i.due) < 0);
  return `<div class="grid-3">
    <div class="card">
      <div class="card-h"><div class="card-t">Answer today</div><div class="card-sub">${critical.length}</div></div>
      ${critical.length ? critical.slice(0,5).map(e => `<div style="padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;" onclick="openMail('${e.id}')"><strong>${esc(e.fromName)}</strong><br><span style="color:var(--t3);">${esc(e.subject).substring(0,60)}</span></div>`).join('') : '<div class="empt" style="padding:18px;">Clear</div>'}
    </div>
    <div class="card">
      <div class="card-h"><div class="card-t">Certificates to chase</div><div class="card-sub">${certs.length}</div></div>
      ${certs.length ? certs.slice(0,5).map(c => `<div style="padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;" onclick="openCert('${c.id}')"><strong>${esc(c.group?.title || '')}</strong> · ${esc(c.certType || c.name)}<br><span style="color:${c.renewal==='OVERDUE'?'var(--red)':'var(--amb)'};font-weight:600;">${c.renewal || ''} ${c.expiry ? '· ' + fD(c.expiry) : ''}</span></div>`).join('') : '<div class="empt" style="padding:18px;">All green</div>'}
    </div>
    <div class="card">
      <div class="card-h"><div class="card-t">Compliance deadlines</div><div class="card-sub">${comp.length}</div></div>
      ${comp.length ? comp.slice(0,5).map(i => `<div style="padding:9px 16px;border-bottom:1px solid var(--line);font-size:12px;"><strong>${esc(i.name).substring(0,55)}</strong><br><span style="color:var(--t3);">${esc(i.homePerson || '')} ${i.due ? '· due ' + fD(i.due) : ''} ${daysUntil(i.due) < 0 ? '<span style="color:var(--red);font-weight:700;">OVERDUE</span>' : ''}</span></div>`).join('') : '<div class="empt" style="padding:18px;">None critical</div>'}
    </div>
  </div>`;
}

async function generateBrief() {
  const el = document.getElementById('briefText');
  el.innerHTML = '<em>Compiling your briefing…</em>';
  const critical = EMAILS.filter(e => (e.risk === 'critical' || e.risk === 'high') && !e.archived).slice(0, 8);
  const certs = (BOARD_CACHE.certs?.items || []).filter(c => { const d = daysUntil(c.expiry); return c.renewal === 'OVERDUE' || c.renewal === 'MISSING — no record' || (d !== null && d < 30); });
  const comp = (BOARD_CACHE.compliance?.items || []).filter(i => i.status !== 'Done');
  const risks = RISK_REGISTER.filter(r => !r.resolved).slice(0, 6);

  const prompt = `You are the executive assistant to Nasir Khamlichi, Head of Legal & Compliance at Living Horizon (CQC-regulated supported living, 8 homes, sister landlord Brunel Management). Write his morning briefing as one tight, confident paragraph of 4-7 sentences. Prioritise ruthlessly: what MUST happen today, what is burning, what can wait. Name specific homes, certificates, senders. No bullet points, no headers, no fluff. End with the single most important action of the day.

INBOX (high/critical): ${critical.map(e => `[${e.cat}/${e.risk}] ${e.fromName}: ${e.subject}`).join(' | ') || 'quiet'}
CERTIFICATES at risk: ${certs.map(c => `${c.group?.title}: ${c.certType} ${c.renewal} exp ${c.expiry || '?'}`).join(' | ') || 'all current'}
COMPLIANCE open (${comp.length}): critical items: ${comp.filter(i=>i.priority==='Critical').map(i => i.name).join(' | ') || 'none'}
RISK REGISTER: ${risks.map(r => `[${r.severity}] ${r.title}`).join(' | ') || 'clear'}`;

  const out = await aiCall(prompt, null, 500);
  if (out) {
    el.innerHTML = out;
    localStorage.setItem('lc_brief_' + new Date().toDateString(), out);
    toast('Briefing generated ✓');
  } else {
    el.innerHTML = 'AI unavailable — check the AI key in Connections.';
  }
}

function copyBrief() {
  const t = document.getElementById('briefText')?.textContent || '';
  navigator.clipboard?.writeText(t).then(() => toast('Copied ✓'));
}

  `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">
    <button class="btn btn-sm ${filter==='all'?'btn-prim':'btn-sec'}" onclick="nav('inbox')">All (${EMAILS.filter(e=>!e.archived).length})</button>

    }).join('')}
    <div style="flex:1;"></div>
    ${CONN.gmailToken ? `<button class="btn btn-gold btn-sm" onclick="gmailScan()">⟳ Scan now</button>` : gmailNeedsOneClick() ? `<button class="btn btn-prim btn-sm" onclick="gmailRequestToken()">▶ Resume Gmail</button>` : `<button class="btn btn-prim btn-sm" onclick="gmailConnect()">Connect Gmail</button>`}
    ${CONN.aiKey && EMAILS.some(e=>!e.aiSummary&&!e.archived) ? `<button class="btn btn-sec btn-sm" onclick="aiTriageBatch();toast('AI triage running…')">✦ AI triage</button>` : ''}
  </div>
  <div class="card">

}

function openMail(id) {
  const e = EMAILS.find(x => x.id === id);
  if (!e) return;
  e.read = true; persist(); updateBadges();
  const cat = MAIL_CATS[e.cat] || MAIL_CATS.info;
  openModal(esc(e.subject), `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
      <span class="pill" style="background:${cat.color}18;color:${cat.color};">${cat.label}</span>
      ${e.risk === 'critical' || e.risk === 'high' ? `<span class="pill ${e.risk==='critical'?'rd':'am'}">${e.risk.toUpperCase()} RISK</span>` : ''}
      <span style="font-size:11px;color:var(--t3);">${esc(e.from)} · ${fDT(e.date)}</span>
    </div>
    ${e.aiSummary ? `<div class="mail-ai" style="margin-bottom:12px;"><strong>§ Assessment:</strong> ${esc(e.aiSummary)}<br>${e.suggestedAction ? `<strong style="color:var(--gold);">→ Next action:</strong> ${esc(e.suggestedAction)}` : ''}</div>` : ''}
    <div style="font-size:13px;line-height:1.7;color:var(--t2);background:var(--paper);border-radius:var(--r3);padding:14px;">${esc(e.snippet)}…</div>
    <div style="font-size:10.5px;color:var(--t4);margin-top:10px;">Full message opens in Gmail — this is the triage preview.</div>
  `, `
    <button class="btn btn-ghost btn-sm" onclick="archiveMail('${e.id}')">Archive</button>
    <button class="btn btn-sec btn-sm" onclick="pushMailToMonday('${e.id}')">↑ Push to Monday</button>
    ${CONN.aiKey ? `<button class="btn btn-sec btn-sm" onclick="draftReply('${e.id}')">✦ Draft reply</button>` : ''}
    <a class="btn btn-prim btn-sm" style="text-decoration:none;" target="_blank" href="https://mail.google.com/mail/u/0/#inbox/${e.threadId || e.id}">Open in Gmail →</a>
  `);
}

function archiveMail(id) {
  const e = EMAILS.find(x => x.id === id);
  if (e) { e.archived = true; persist(); closeModal(); render(); toast('Archived'); }
}

// Push an email into the Monday sync queue (choose board)
function pushMailToMonday(id) {
  const e = EMAILS.find(x => x.id === id);
  if (!e) return;
  const suggested = e.mondayPush || (e.cat === 'compliance' || e.cat === 'cqc' ? 'complianceActions' : e.cat === 'hr' ? 'sharedTasks' : 'sharedTasks');
  closeModal();
  openModal('Push to Monday.com', `
    <div style="font-size:12.5px;color:var(--t2);margin-bottom:12px;">Create an item from this email. It goes into the sync queue and pushes on your confirmation.</div>
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:5px;">Item name</label>
    <input id="pushName" type="text" value="${esc(e.subject)}" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;outline:none;margin-bottom:12px;">
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:5px;">Target board</label>
    <select id="pushBoard" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;outline:none;background:white;">
      ${['complianceActions','sharedTasks','candidates','onboarding','complaints','referrals'].map(k =>
        `<option value="${k}" ${k===suggested?'selected':''}>${MONDAY_CONFIG.boards[k].name}</option>`).join('')}
    </select>
    <div style="font-size:11px;color:var(--t3);margin-top:10px;">The email summary and a link back to the thread go into the item's update.</div>
  `, `
    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="confirmPush('${e.id}')">Queue push →</button>
  `);
}

function confirmPush(emailId) {
  const e = EMAILS.find(x => x.id === emailId);
  const name = document.getElementById('pushName')?.value || e.subject;
  const boardKey = document.getElementById('pushBoard')?.value || 'sharedTasks';
  SYNC_QUEUE.unshift({
    id: 'sq_' + Date.now(),

function deleteDraft(id) { DRAFTS = DRAFTS.filter(d => d.id !== id); persist(); render(); toast('Discarded'); }
function copyDraft(id) {
  const v = document.getElementById('draft_' + id)?.value || '';
  navigator.clipboard?.writeText(v).then(() => toast('Copied ✓'));
}

async function sendDraft(id) {
  const d = DRAFTS.find(x => x.id === id);
  if (!d) return;
  const body = document.getElementById('draft_' + id)?.value || d.body;
  if (!confirm('Send this reply now via Gmail?')) return;
  try {
    const toAddr = (d.to.match(/<([^>]+)>/) || [, d.to])[1];
    const raw = btoa(unescape(encodeURIComponent(
      `To: ${toAddr}\r\nSubject: ${d.subject}\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n${body}`
    ))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    await gmailApi('messages/send', { method: 'POST', body: JSON.stringify({ raw }) });
    d.status = 'sent'; d.body = body; persist(); render();
    logActivity('email_sent', { to: toAddr, subject: d.subject });
    toast('Sent ✓');
  } catch (e) { toast('Send failed: ' + e.message); }
}

  const missing = certs.filter(c => c.renewal === 'MISSING — no record');
  const due30 = certs.filter(c => { const d = daysUntil(c.expiry); return d !== null && d >= 0 && d < 30; });
  const due90 = certs.filter(c => { const d = daysUntil(c.expiry); return d !== null && d >= 30 && d < 90; });

  m.innerHTML = bc('Compliance', 'Certificate <em>Planner</em>', `Brunel — Safety Certificates · ${certs.length} certificates across ${HOMES.length} homes`) +
  `<div class="grid-4 mb-4">
    <div class="kpi ${overdue.length ? 'rd' : 'gr'}"><div class="kpi-label">Overdue</div><div class="kpi-val">${overdue.length}</div></div>
    <div class="kpi ${missing.length ? 'rd' : 'gr'}"><div class="kpi-label">Missing</div><div class="kpi-val">${missing.length}</div><div class="kpi-note">no record held</div></div>
    <div class="kpi ${due30.length ? 'am' : 'gr'}"><div class="kpi-label">Due &lt; 30 days</div><div class="kpi-val">${due30.length}</div></div>
    <div class="kpi bl"><div class="kpi-label">Due 30–90 days</div><div class="kpi-val">${due90.length}</div></div>
  </div>
  <div class="card mb-4">
    <div class="card-h"><div class="card-t">Renewal horizon by home</div>
      ${CONN.mondayToken ? `<button class="btn btn-gold btn-sm" style="margin-left:auto;" onclick="syncAllBoards().then(()=>{scanCertRisks();render();toast('Synced ✓')})">⟳ Sync</button>` : ''}
    </div>
    <div class="card-body">${certLanes(certs)}
      <div style="display:flex;gap:14px;margin-top:12px;font-size:10px;color:var(--t3);">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--grn);margin-right:4px;"></span>Valid</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--amb);margin-right:4px;"></span>Due &lt;30d</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--purp);margin-right:4px;"></span>Booked</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--red);margin-right:4px;"></span>Overdue</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:#8A8F9C;margin-right:4px;"></span>Missing</span>
      </div>

    <div class="card-h"><div class="card-t">Action list</div></div>
    <table class="tbl">
      <tr><th>Home</th><th>Certificate</th><th>Status</th><th>Expiry</th><th>Duty holder</th><th>Evidence</th></tr>
      ${[...overdue, ...missing, ...due30].map(c => {
        const v = VERIFY_LEVELS[c.verifiedHow];
        const d = daysUntil(c.expiry);
        return `<tr class="click" onclick="openCert('${c.id}')">

function openCert(id) {
  const c = (BOARD_CACHE.certs?.items || []).find(x => x.id === id);
  if (!c) return;
  const v = VERIFY_LEVELS[c.verifiedHow];
  const d = daysUntil(c.expiry);
  openModal(`${esc(c.group?.title || '')} — ${esc(c.certType || c.name)}`, `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      <span class="pill ${c.renewal==='Valid'?'gr':c.renewal==='OVERDUE'?'rd':c.renewal==='Booked'?'pu':'am'}">${c.renewal || '?'}</span>
      ${c.expiry ? `<span class="pill gy">Expires ${fD(c.expiry)}${d !== null ? ` · ${d < 0 ? Math.abs(d) + 'd overdue' : d + 'd left'}` : ''}</span>` : ''}
      ${c.dutyHolder ? `<span class="pill au">${esc(c.dutyHolder)}</span>` : ''}
    </div>
    <div style="border:1.5px solid ${v ? v.color : 'var(--red)'}40;border-radius:var(--r3);padding:11px 13px;background:${v ? v.color : 'var(--red)'}0A;">
      <div style="font-size:9.5px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:${v ? v.color : 'var(--red)'};margin-bottom:3px;">Evidence status</div>
      <div style="font-size:12px;font-weight:600;">${esc(c.verifiedHow || 'NOT VERIFIED')}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:2px;">${v ? v.desc : ''} ${c.verifiedOn ? `Last verified ${fD(c.verifiedOn)}.` : 'Never verified against the actual document.'}</div>
    </div>
    ${c.dutyHolder && c.dutyHolder.includes('Trinity') ? '<div style="font-size:11.5px;color:var(--amb);margin-top:10px;background:var(--asf2);padding:9px 12px;border-radius:var(--r3);">Trinity HA is duty holder — LH still shares responsibility under the SLA. We must hold a copy either way.</div>' : ''}
  `, `
    ${CONN.mondayToken ? `<button class="btn btn-sec btn-sm" onclick="markCertBooked('${c.id}')">Mark booked</button>` : ''}
    <a class="btn btn-prim btn-sm" style="text-decoration:none;" target="_blank" href="https://livinghorizon.monday.com/boards/${MONDAY_CONFIG.boards.safetyCerts.id}/pulses/${c.id}">Open in Monday →</a>
  `);
}

async function markCertBooked(id) {
  try {
    await mondayUpdateItem(MONDAY_CONFIG.boards.safetyCerts.id, id, {
      [MONDAY_CONFIG.boards.safetyCerts.cols.renewal]: { label: 'Booked' }
    });
    const c = (BOARD_CACHE.certs?.items || []).find(x => x.id === id);
    if (c) c.renewal = 'Booked';
    persist(); closeModal(); render();
    toast('Marked as Booked in Monday ✓');
  } catch (e) { toast('Update failed: ' + e.message); }
}

  const all = [

    const rb = i.cols?.[MONDAY_CONFIG.boards.safetyCerts.cols.reviewBy]?.date || i.cols?.[MONDAY_CONFIG.boards.complianceActions.cols.reviewBy]?.date;

    <div class="brief-label">The verification doctrine</div>
    <div class="brief-text" style="font-size:12.5px;">A search that came back empty is never verification — it can only confirm something <em>is</em> there, never that it is not. Incidents and care notes live on PCS; HR is moving to Workforce. Neither is visible from Monday. Never instruct a solicitor on a row marked NOT VERIFIED.</div>
  </div>
  <div class="grid-3 mb-4">
    ${Object.entries(VERIFY_LEVELS).map(([label, v]) => `
      <div class="card" style="border-left:3px solid ${v.color};">
        <div class="card-body" style="padding:11px 14px;display:flex;align-items:center;gap:11px;">

    <div class="card">
      <div class="card-h"><div class="card-t">Past review-by date</div><div class="card-sub">${stale.length}</div></div>

function pipelineView(items, boardKey, emptyMsg) {
  if (!items.length) return `<div class="card"><div class="empt">${emptyMsg}</div></div>`;
  // Group by board group (stage)
  const stages = {};
  items.forEach(i => {
    const g = i.group?.title || 'Unsorted';
    if (!stages[g]) stages[g] = [];
    stages[g].push(i);
  });
  return `<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;">
    ${Object.entries(stages).map(([stage, list]) => `
      <div style="min-width:230px;flex:1;">
        <div style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);padding:0 4px 8px;display:flex;justify-content:space-between;">

      </div>`).join('')}
  </div>`;
}

  closeModal();

function globalSearch(q) {
  if (!q) return;
  const ql = q.toLowerCase();
  const mails = EMAILS.filter(e => (e.subject + e.from + e.snippet).toLowerCase().includes(ql)).slice(0, 6);
  const certs = (BOARD_CACHE.certs?.items || []).filter(c => (c.name + (c.group?.title||'') + (c.certType||'')).toLowerCase().includes(ql)).slice(0, 6);
  const comp = (BOARD_CACHE.compliance?.items || []).filter(i => (i.name + (i.homePerson||'')).toLowerCase().includes(ql)).slice(0, 6);
  openModal(`Search — "${esc(q)}"`, `
    ${mails.length ? `<div style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;">Mail</div>` + mails.map(e => `<div style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;" onclick="closeModal();openMail('${e.id}')"><strong>${esc(e.fromName)}</strong> — ${esc(e.subject)}</div>`).join('') : ''}
    ${certs.length ? `<div style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin:12px 0 6px;">Certificates</div>` + certs.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;" onclick="closeModal();openCert('${c.id}')"><strong>${esc(c.group?.title||'')}</strong> — ${esc(c.certType || c.name)}</div>`).join('') : ''}
    ${comp.length ? `<div style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin:12px 0 6px;">Compliance</div>` + comp.map(i => `<div style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;" onclick="closeModal();openComplianceItem('${i.id}')">${esc(i.name)}</div>`).join('') : ''}
    ${!mails.length && !certs.length && !comp.length ? '<div class="empt">Nothing found</div>' : ''}
  `);
}

// ── Business context snapshot for the AI ──────────────────────
function buildBusinessContext() {
  const unread = EMAILS.filter(e => !e.read && !e.archived);
  const critMail = EMAILS.filter(e => (e.risk === 'critical' || e.risk === 'high') && !e.archived).slice(0, 10);
  const risks = RISK_REGISTER.filter(r => !r.resolved).slice(0, 10);
  const comp = (BOARD_CACHE.compliance?.items || []).filter(i => i.status !== 'Done');
  const certs = (BOARD_CACHE.certs?.items || []);
  const certBad = certs.filter(c => c.renewal === 'OVERDUE' || c.renewal === 'MISSING — no record' || (daysUntil(c.expiry) !== null && daysUntil(c.expiry) < 30));
  const openTasks = MY_TASKS.filter(t => t.col !== 'done');
  const pendingSync = SYNC_QUEUE.filter(s => s.status === 'pending');

// ── Tool executor ─────────────────────────────────────────────
async function executeAITool(name, input) {
  try {
    if (name === 'create_task') {
      const t = {
        id: 'mt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        title: input.title, notes: input.notes || '', due: input.due || null,
        priority: input.priority || 'medium', col: input.column || 'todo',
        created: new Date().toISOString(), source: 'assistant',
      };
      MY_TASKS.unshift(t); persistChat(); updateBadges();
      return { ok: true, msg: `Task added to board: "${t.title}" (${t.col}, ${t.priority}${t.due ? ', due ' + t.due : ''})`, chip: '✓ Task added — ' + t.title };
    }
    if (name === 'move_task') {
      const q = input.title_match.toLowerCase();
      const t = MY_TASKS.find(x => x.title.toLowerCase().includes(q));
      if (!t) return { ok: false, msg: `No task matching "${input.title_match}" found. Open tasks: ${MY_TASKS.filter(x => x.col !== 'done').map(x => x.title).join('; ')}` };
      t.col = input.column; if (input.column === 'done') t.completedAt = new Date().toISOString();
      persistChat(); updateBadges();
      return { ok: true, msg: `Moved "${t.title}" to ${input.column}`, chip: (input.column === 'done' ? '✓ Completed — ' : '→ Moved — ') + t.title };
    }
    if (name === 'send_email') {
      if (!CONN.gmailToken) return { ok: false, msg: 'Gmail is not connected. Tell Nasir to connect Gmail in Connections first.' };
      return { ok: true, pendingMail: { to: input.to, subject: input.subject, body: input.body },
        msg: 'Email prepared and shown to Nasir with a one-click Send button. Tell him it is ready to fire.', chip: '✉ Email prepared — ' + input.subject };
    }
    if (name === 'push_to_monday') {
      const board = MONDAY_CONFIG.boards[input.board_key];
      if (!board) return { ok: false, msg: 'Unknown board' };
      if (CONN.mondayToken) {
        const item = await mondayCreateItem(board.id, input.item_name, {});
        if (input.update_text) await mondayAddUpdate(item.id, input.update_text);
        logActivity('monday_push', { board: board.name, item: input.item_name, via: 'assistant' });
        return { ok: true, msg: `Created "${input.item_name}" on ${board.name} (item ${item.id}). Link: https://livinghorizon.monday.com/boards/${board.id}/pulses/${item.id}`, chip: '📋 Pushed to ' + board.name };
      }
      SYNC_QUEUE.unshift({ id: 'sq_' + Date.now(), ts: new Date().toISOString(), itemName: input.item_name, boardKey: input.board_key, body: input.update_text || '', status: 'pending' });
      persist(); updateBadges();
      return { ok: true, msg: `Monday not connected — queued "${input.item_name}" for ${board.name} in the Sync Queue.`, chip: '⧗ Queued for ' + board.name };
    }
    if (name === 'get_business_data') {
      const a = input.area;
      if (a === 'emails') return { ok: true, msg: JSON.stringify(EMAILS.filter(e => !e.archived).slice(0, 40).map(e => ({ from: e.fromName, subject: e.subject, cat: e.cat, risk: e.risk, date: e.date, summary: e.aiSummary, snippet: (e.snippet || '').slice(0, 140) }))) };
      if (a === 'compliance') return { ok: true, msg: JSON.stringify((BOARD_CACHE.compliance?.items || []).map(i => ({ name: i.name, priority: i.priority, status: i.status, home: i.homePerson, due: i.due, evidence: i.verifiedHow }))) };
      if (a === 'certificates') return { ok: true, msg: JSON.stringify((BOARD_CACHE.certs?.items || []).map(c => ({ home: c.group?.title, type: c.certType || c.name, status: c.renewal, expiry: c.expiry, dutyHolder: c.dutyHolder, evidence: c.verifiedHow }))) };
      if (a === 'tasks') return { ok: true, msg: JSON.stringify(MY_TASKS) };
      if (a === 'risks') return { ok: true, msg: JSON.stringify(RISK_REGISTER.filter(r => !r.resolved)) };
      if (a === 'drafts') return { ok: true, msg: JSON.stringify(DRAFTS.slice(0, 10).map(d => ({ to: d.to, subject: d.subject, status: d.status }))) };
      if (a === 'oversight') { const o = computeOversight(); return { ok: true, msg: JSON.stringify({ lastSync: OVERSIGHT_CACHE.lastSync, totals: o.totals, boards: o.boards.map(b => ({ name: b.name, score: b.score, open: b.open, exceptions: b.exceptions.slice(0, 12) })) }) }; }
      return { ok: false, msg: 'Unknown area' };
    }
    return { ok: false, msg: 'Unknown tool' };
  } catch (e) { return { ok: false, msg: 'Tool error: ' + e.message }; }
}

// ── Agent loop — Anthropic tool use ───────────────────────────
async function runAgentLoop(userMsg) {
  const history = CHAT.slice(-16).filter(c => c.role === 'user' || c.role === 'assistant')
    .map(c => ({ role: c.role, content: c.content }));
  const apiMessages = [...history];
  const chips = [];
  let pendingMail = null;

  for (let hop = 0; hop < 6; hop++) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json', 'x-api-key': CONN.aiKey,
        'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: AI_MODEL, max_tokens: 1600,
        system: buildAssistantSystem(), tools: AI_TOOLS, messages: apiMessages,
      }),
    });
    const d = await res.json();
    if (d.error) {
      const msg = d.error.message || 'AI error';
      if (/model/i.test(msg)) throw new Error('The AI model name was rejected by Anthropic (' + msg + '). The app may need its AI_MODEL constant updated to a current model.');
      if (/credit|billing/i.test(msg)) throw new Error('Anthropic account issue: ' + msg + ' — check billing at console.anthropic.com');
      if (/authentication|api.key|invalid/i.test(msg)) throw new Error('API key rejected — re-enter it in Connections.');
      throw new Error(msg);
    }

    const toolUses = (d.content || []).filter(b => b.type === 'tool_use');
    const textOut = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');

    if (d.stop_reason === 'tool_use' && toolUses.length) {
      apiMessages.push({ role: 'assistant', content: d.content });
      const results = [];
      for (const tu of toolUses) {
        const r = await executeAITool(tu.name, tu.input || {});
        if (r.chip) chips.push(r.chip);
        if (r.pendingMail) pendingMail = r.pendingMail;
        results.push({ type: 'tool_result', tool_use_id: tu.id, content: r.msg });
      }
      apiMessages.push({ role: 'user', content: results });
      continue;
    }
    // Final answer
    return { text: textOut || '…', chips, pendingMail };
  }
  return { text: 'I hit the action limit for one message — the work so far is done. Ask me to continue.', chips, pendingMail };
}

async function sendChat(preset, source) {
  const input = document.getElementById(source === 'dock' ? 'dockIn' : 'chatIn') || document.getElementById('dockIn') || document.getElementById('chatIn');
  const msg = (preset || input?.value || '').trim();
  if (!msg) return;
  if (!CONN.aiKey) { toast('Connect the AI engine first'); nav('connect'); return; }
  if (input) { input.value = ''; input.style.height = 'auto'; }
  CHAT.push({ role: 'user', content: msg, ts: new Date().toISOString() });
  persistChat(); renderChatMessages(true);
  try {
    const out = await runAgentLoop(msg);
    CHAT.push({ role: 'assistant', content: out.text, ts: new Date().toISOString(), chips: out.chips, pendingMail: out.pendingMail });
  } catch (e) {
    CHAT.push({ role: 'assistant', content: '⚠ ' + e.message, ts: new Date().toISOString() });
  }
  persistChat(); renderChatMessages(false);
  updateBadges();
}

// tiny markdown: **bold**, bullet lines, line breaks — applied AFTER escaping
function mdLite(s) {
  let h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.split('\n').map(line => {
    if (/^\s*[-•]\s+/.test(line)) return '<div style="padding-left:14px;text-indent:-10px;">• ' + line.replace(/^\s*[-•]\s+/, '') + '</div>';
    if (/^#{1,3}\s+/.test(line)) return '<div style="font-family:var(--serif);font-size:15px;margin:8px 0 3px;">' + line.replace(/^#{1,3}\s+/, '') + '</div>';
    return line ? '<div>' + line + '</div>' : '<div style="height:7px;"></div>';
  }).join('');
  return h;
}

const DONE_LABELS = /^(done|complete|completed|approved|passed|valid|closed|resolved|hired|sent|verified|signed off|signed-off|received|finished|yes|n\/a|not applicable|no longer needed|booked)$/i;
const STUCK_LABELS = /(stuck|blocked|failed|overdue|missing|expired|rejected|escalat|breach|urgent|critical)/i;
const STALE_DAYS = 14;

// Generic board sync — pulls every registry board with status/date/people extraction
async function syncOversight(progressCb) {
  const keys = Object.keys(OVERSIGHT_REGISTRY);
  let done = 0;
  OVERSIGHT_CACHE.boards = OVERSIGHT_CACHE.boards || {};
  for (const key of keys) {
    const reg = OVERSIGHT_REGISTRY[key];
    try {
      const q = `query($bid:[ID!]){
        boards(ids:$bid){ id name items_count
          columns{ id title type }
          items_page(limit:100){ items{ id name updated_at group{ id title }
            column_values{ id text type ... on StatusValue{ label } ... on DateValue{ date } ... on PeopleValue{ persons_and_teams{ id } } }
          } }
        }
      }`;
      const d = await mondayQuery(q, { bid: [String(reg.id)] });
      const board = d.boards?.[0];
      if (!board) continue;
      const colTypes = {};
      (board.columns || []).forEach(c => colTypes[c.id] = { title: c.title, type: c.type });
      OVERSIGHT_CACHE.boards[key] = {
        id: board.id, name: reg.name, area: reg.area,
        total: board.items_count, fetched: new Date().toISOString(),
        items: (board.items_page?.items || []).map(it => {
          const statuses = [], dates = [], hasPeople = { any: false, filled: false };
          (it.column_values || []).forEach(cv => {
            if (cv.type === 'status' && cv.label) statuses.push({ col: colTypes[cv.id]?.title || cv.id, label: cv.label });
            if (cv.type === 'date' && cv.date) dates.push({ col: colTypes[cv.id]?.title || cv.id, date: cv.date });
            if (cv.type === 'people') { hasPeople.any = true; if (cv.persons_and_teams?.length) hasPeople.filled = true; }
          });
          return { id: it.id, name: it.name, group: it.group?.title || '', updatedAt: it.updated_at, statuses, dates, people: hasPeople };
        }),
      };
    } catch (e) { console.warn('Oversight sync failed', key, e.message); }
    done++;
    if (progressCb) progressCb(done, keys.length, reg.name);
  }
  OVERSIGHT_CACHE.lastSync = new Date().toISOString();
  persistOversight();
}

let OVERSIGHT_CACHE = JSON.parse(localStorage.getItem('lc_oversight') || '{"boards":{}}');
function persistOversight() {
  try { localStorage.setItem('lc_oversight', JSON.stringify(OVERSIGHT_CACHE)); } catch (e) {
    // localStorage full — drop item detail, keep summaries
    try {
      const slim = { lastSync: OVERSIGHT_CACHE.lastSync, boards: {} };
      Object.entries(OVERSIGHT_CACHE.boards).forEach(([k, b]) => {
        slim.boards[k] = { ...b, items: b.items.slice(0, 40) };
      });
      localStorage.setItem('lc_oversight', JSON.stringify(slim));
    } catch (e2) {}
  }
}

// The accountability sweep — what is NOT being done?
function computeOversight() {
  const out = { boards: [], totals: { overdue: 0, stuck: 0, unassigned: 0, stale: 0, items: 0 } };
  Object.entries(OVERSIGHT_CACHE.boards || {}).forEach(([key, b]) => {
    const ex = [];
    (b.items || []).forEach(it => {
      const isDone = it.statuses.some(s => DONE_LABELS.test(s.label));
      if (isDone) return;
      // Overdue: any date in the past on a not-done item
      const past = it.dates.filter(d => daysUntil(d.date) !== null && daysUntil(d.date) < 0);
      if (past.length) ex.push({ type: 'overdue', item: it.name, id: it.id, detail: `${past[0].col} was ${fD(past[0].date)} (${Math.abs(daysUntil(past[0].date))}d ago)`, group: it.group });
      // Stuck: status literally says so
      const stuck = it.statuses.find(s => STUCK_LABELS.test(s.label));
      if (stuck) ex.push({ type: 'stuck', item: it.name, id: it.id, detail: `${stuck.col}: ${stuck.label}`, group: it.group });
      // Unassigned: board uses people columns but this item has nobody
      if (it.people.any && !it.people.filled) ex.push({ type: 'unassigned', item: it.name, id: it.id, detail: 'No owner assigned', group: it.group });
      // Stale: untouched for STALE_DAYS
      if (it.updatedAt && (Date.now() - new Date(it.updatedAt)) / 86400000 > STALE_DAYS)
        ex.push({ type: 'stale', item: it.name, id: it.id, detail: `No activity for ${Math.floor((Date.now() - new Date(it.updatedAt)) / 86400000)} days`, group: it.group });
    });
    // Dedupe per item per type, score the board
    const seen = new Set();
    const clean = ex.filter(e => { const k = e.id + e.type; if (seen.has(k)) return false; seen.add(k); return true; });
    const openItems = (b.items || []).filter(it => !it.statuses.some(s => DONE_LABELS.test(s.label))).length;
    const weight = { overdue: 3, stuck: 3, unassigned: 1.5, stale: 1 };
    const penalty = clean.reduce((a, e) => a + weight[e.type], 0);
    const score = Math.max(0, Math.round(100 - (openItems ? (penalty / Math.max(openItems, 1)) * 22 : 0)));
    clean.forEach(e => out.totals[e.type]++);
    out.totals.items += b.items?.length || 0;
    out.boards.push({ key, name: b.name, area: b.area, boardId: b.id, total: b.total, loaded: b.items?.length || 0, open: openItems, exceptions: clean, score, fetched: b.fetched });
  });
  out.boards.sort((a, b) => a.score - b.score);
  return out;
}

function oversightSummaryLine() {
  const o = computeOversight();
  if (!o.boards.length) return 'Oversight: not yet synced.';
  const worst = o.boards.slice(0, 4).filter(b => b.score < 85);
  return `OVERSIGHT (${o.boards.length} boards audited): ${o.totals.overdue} overdue, ${o.totals.stuck} stuck, ${o.totals.unassigned} unassigned, ${o.totals.stale} stale. Weakest boards: ${worst.map(b => `${b.name} (${b.score}/100)`).join(', ') || 'all healthy'}`;
}

      const entries = Object.entries(dist).sort((a, b2) => b2[1] - a[1]);
      const total = entries.reduce((a, [, n]) => a + n, 0) || 1;
      const colorFor = l => DONE_LABELS.test(l) ? 'var(--grn)' : STUCK_LABELS.test(l) ? 'var(--red)' : /working|progress|review|pending|await|interview|in /i.test(l) ? 'var(--amb)' : l === 'No status' ? '#C9CDD6' : 'var(--a)';
      return `<div class="card">
        <div class="card-h">
          <div class="card-t" style="font-size:13.5px;">${esc(b.name)}</div>
          <span class="pill ${b.score >= 85 ? 'gr' : b.score >= 60 ? 'am' : 'rd'}" style="margin-left:auto;">${b.score}/100</span>
        </div>
        <div class="card-body">
          <div style="display:flex;height:22px;border-radius:7px;overflow:hidden;margin-bottom:10px;">
            ${entries.map(([l, n]) => `<div title="${esc(l)}: ${n}" style="width:${(n/total*100).toFixed(1)}%;background:${colorFor(l)};"></div>`).join('')}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--t3);">
            ${entries.slice(0, 6).map(([l, n]) => `<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${colorFor(l)};margin-right:4px;"></span>${esc(l)} · ${n}</span>`).join('')}
          </div>
          ${b.exceptions.length ? `<div style="margin-top:10px;padding:8px 11px;background:var(--rsf);border-radius:8px;font-size:11px;color:var(--red);font-weight:600;">${b.exceptions.length} exception${b.exceptions.length===1?'':'s'} — <a style="color:var(--red);cursor:pointer;text-decoration:underline;" onclick="nav('oversight',{area:'${b.area}'})">view in Oversight</a></div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>` : `<div class="card"><div class="empt">Run the Oversight sweep first — this page draws from the same live data</div></div>`);
}

// ── BOOT ──────────────────────────────────────────────────────
updateConnDots();
updateBadges();
render();
// Restore the Gmail session on load — sign in once, stay signed in
(function bootGmailSession() {
  if (CONN.gmailToken) {
    // Valid stored token — carry on, schedule its renewal
    scheduleGmailRefresh();
  } else if (CONN.googleClientId && localStorage.getItem('lc_gmail_granted')) {
    // Token expired while away — renew silently in the background
    silentGmailRefresh().then(ok => {
      updateConnDots();
      if (ok) { render(); gmailScan(15); toast('Gmail session restored ✓'); }
      else { render(); } // re-render so the one-click Resume button appears
    });
  }
})();

// Gentle auto-rescan every 5 minutes when connected
setInterval(() => { if (CONN.gmailToken) gmailScan(15); }, 5 * 60 * 1000);
</script>
