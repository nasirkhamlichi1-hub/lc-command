const MA_HOUSES = [...HOMES, 'Wingate Walk'];
const AUDIT_ORDER = ['cqc', 'pamms', 'premises', 'staff', 'spot', 'training', 'la', 'med', 'careplan'];

function maScale(fw) { const s = AUDIT_LIB[fw].scale; return s === 'cqc' ? SCALE_CQC : s === 'pamms' ? SCALE_PAMMS : SCALE_MET; }

function maSectionScore(audit, stds) {
  const sc = maScale(audit.fw);
  const rs = stds.map(s => audit.ratings[s.c]?.r).filter(r => r && sc[r] && sc[r].v !== null);
  if (!rs.length) return { pct: null, band: 'NA' };
  if (audit.fw === 'pamms') {
    // PAMMS precedence — mirrors how the real assessor rated sections
    let band;
    if (rs.includes('P')) band = 'P';
    else if (rs.includes('RI')) band = 'RI';
    else if (rs.every(r => r === 'EX')) band = 'EX';
    else band = 'G';
    const pct = Math.round(rs.map(r => sc[r].v).reduce((a, b) => a + b, 0) / (rs.length * 4) * 100);
    return { pct, band };
  }
  const vals = rs.map(r => sc[r].v);
  const max = audit.fw === 'cqc' ? 4 : 1;
  const pct = Math.round(vals.reduce((a, b) => a + b, 0) / (vals.length * max) * 100);
  let band;
  if (audit.fw === 'cqc') {
    // CQC’s published scoring bands
    band = pct >= 87 ? 'OUT' : pct >= 63 ? 'G' : pct >= 39 ? 'RI' : 'IN';
  } else {
    band = pct >= 95 ? 'M' : pct >= 70 ? 'PM' : 'NM';
  }
  return { pct, band };
}

function maOverall(audit) {
  const lib = AUDIT_LIB[audit.fw];
  const all = lib.tpl.flatMap(d => d.sections.flatMap(s => s.stds));
  const rated = all.filter(s => audit.ratings[s.c]?.r).length;
  if (audit.fw === 'pamms') {
    // Section bands roll up as the real assessor rolls them
    const bands = lib.tpl.flatMap(d => d.sections.map(s => maSectionScore(audit, s.stds).band)).filter(b => b !== 'NA');
    let band = 'NA';
    if (bands.length) {
      // Calibrated against the real Wingate Walk report: 4 RI sections of 15 still scored overall Good
      const ri = bands.filter(b => b === 'RI').length;
      if (bands.includes('P')) band = 'P';
      else if (ri > bands.length / 2) band = 'RI';
      else if (bands.every(b => b === 'EX')) band = 'EX';
      else band = 'G';
    }
    return { rated, total: all.length, pct: null, band };
  }
  const whole = maSectionScore(audit, all);
  return { rated, total: all.length, ...whole };
}

function maSetRating(auditId, code, r) {
  const a = MA_AUDITS.find(x => x.id === auditId);
  if (!a) return;
  if (!a.ratings[code]) a.ratings[code] = {};
  a.ratings[code].r = a.ratings[code].r === r ? null : r;
  persistMA(); render();
}

function maNote(auditId, code) {
  const a = MA_AUDITS.find(x => x.id === auditId);
  if (!a) return;
  openModal(`${code} — what we found`, `
    <textarea id="maNoteIn" style="width:100%;min-height:140px;padding:12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-family:var(--sans);font-size:12.5px;line-height:1.65;outline:none;">${esc(a.ratings[code]?.note || '')}</textarea>
  `, `
    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="maSaveNote('${auditId}','${code}')">Save</button>
  `);
}
function maSaveNote(auditId, code) {
  const a = MA_AUDITS.find(x => x.id === auditId);
  if (!a.ratings[code]) a.ratings[code] = {};
  a.ratings[code].note = document.getElementById('maNoteIn')?.value || '';
  persistMA(); closeModal(); render();
}

function maSubjects(fw) {
  const lib = AUDIT_LIB[fw];
  if (lib.subjects) return lib.subjects;
  if (fw === 'training') return [...MA_HOUSES, 'Whole service'];
  if (lib.subject === 'house') return MA_HOUSES;
  return null; // free text
}

function maNew(fw) {
  const lib = AUDIT_LIB[fw];
  const subjects = maSubjects(fw);
  const subjLabel = lib.subject === 'house' ? 'House' : lib.subject === 'council' ? 'Council' : fw === 'staff' ? 'Staff member' : 'Subject';
  openModal('New ' + lib.name, `
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:5px;">${subjLabel}</label>
    ${subjects
      ? `<select id="maSubj" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;background:white;margin-bottom:12px;">${subjects.map(h => `<option>${h}</option>`).join('')}</select>`
      : `<input id="maSubj" type="text" placeholder="${fw === 'staff' ? 'Staff member name or initials' : 'Resident initials (keep records GDPR-clean)'}" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;margin-bottom:12px;">`}
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:5px;">Audit date</label>

    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="maCreate('${fw}')">Start audit</button>
  `);
}

function seedWingateMA() {
  if (MA_AUDITS.some(a => a.id === 'ma_wingate')) return;
  // Reuse the seeded PAMMS audit data if present, else build it
  seedWingateAudit();
  const src = PAMMS_AUDITS.find(a => a.seeded);
  if (src) {
    MA_AUDITS.push({ id: 'ma_wingate', fw: 'pamms', subject: 'Wingate Walk', date: src.date, seeded: true, ratings: JSON.parse(JSON.stringify(src.ratings)) });
  }
  // Migrate any user-created PAMMS audits from the old page (one-time)
  if (!localStorage.getItem('lc_pamms_migrated')) {
    PAMMS_AUDITS.filter(a => !a.seeded).forEach(a => {
      MA_AUDITS.push({ id: 'ma_mig_' + a.id, fw: 'pamms', subject: a.house, date: a.date, ratings: a.ratings });
    });
    try { localStorage.setItem('lc_pamms_migrated', '1'); } catch (e) {}
  }
  persistMA();
}

function maCreate(fw) {
  const subj = document.getElementById('maSubj')?.value?.trim() || 'Unnamed';
  const date = document.getElementById('maDate')?.value || new Date().toISOString().slice(0,10);
  const a = { id: 'ma_' + Date.now(), fw, subject: subj, date, ratings: {} };
  MA_AUDITS.unshift(a);
  persistMA(); closeModal();
  nav('audits', { fw, aid: a.id });
}

function maDelete(id) {
  if (!confirm('Delete this audit?')) return;
  const a = MA_AUDITS.find(x => x.id === id);
  MA_AUDITS = MA_AUDITS.filter(x => x.id !== id);
  persistMA(); nav('audits', { fw: a?.fw });
}

function maCopy(id) {
  const a = MA_AUDITS.find(x => x.id === id);
  if (!a) return;
  const lib = AUDIT_LIB[a.fw];
  const sc = maScale(a.fw);
  const ov = maOverall(a);
  let md = `# ${lib.name} — ${a.subject}\n${fD(a.date)} · self-audit\nComputed: ${sc[ov.band]?.label || '—'}${ov.pct !== null ? ' (' + ov.pct + '%)' : ''} · ${ov.rated}/${ov.total} standards rated\n`;
  lib.tpl.forEach(d => {
    md += `\n## ${d.domain}\n`;
    d.sections.forEach(s => {
      const ss = maSectionScore(a, s.stds);
      md += `\n### ${s.name} — ${sc[ss.band]?.label || 'Not assessed'}${ss.pct !== null ? ' (' + ss.pct + '%)' : ''}\n`;
      s.stds.forEach(st => {
        const r = a.ratings[st.c];
        md += `- **${st.c}** [${r?.r ? sc[r.r].label : 'Unrated'}] ${st.t}\n`;
        if (r?.note) md += `  - What we found: ${r.note}\n`;
      });
    });
  });
  navigator.clipboard?.writeText(md).then(() => toast('Audit report copied ✓'));
}

// ═══ RENDER — Audits: domain grid → requirements → run audit ═══
function renderAudits(m) {
  seedWingateMA();
  const fw = curState.fw;
  if (!fw) { renderAuditGrid(m); return; }
  const lib = AUDIT_LIB[fw];
  const fwAudits = MA_AUDITS.filter(a => a.fw === fw);
  const aid = curState.aid;
  const audit = fwAudits.find(a => a.id === aid);
  if (!audit) { renderAuditLanding(m, fw, lib, fwAudits); return; }
  renderAuditRun(m, fw, lib, fwAudits, audit);
}

      return `<div class="card" style="cursor:pointer;transition:border 0.15s;" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--line)'" onclick="nav('audits',{fw:'${k}'})">

            </div>
            ${last && lastOv ? `<span class="pill" style="background:${(sc[lastOv.band]?.color||'#8A8F9C')}1C;color:${sc[lastOv.band]?.color||'#8A8F9C'};">${sc[lastOv.band]?.label || '—'}</span>` : '<span class="pill gy">not yet run</span>'}
          </div>
          <div style="font-size:11.5px;color:var(--t3);line-height:1.6;">${esc(l.desc)}</div>
          ${last ? `<div style="font-size:10px;color:var(--t4);margin-top:8px;">Latest: ${esc(last.subject)} · ${fD(last.date)}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// ASSESSOR'S LENS — what inspectors examine & what strong evidence is
// CQC entries: grounded in the published Single Assessment Framework
// (paraphrased, not CQC's verbatim text). PAMMS: the standard text
// plus the REAL assessor findings from the Wingate Walk report.
// ═══════════════════════════════════════════════════════════════
// CQC gathers evidence in six published categories: people's experience
// of care · feedback from staff and leaders · feedback from partners ·
// observation · processes · outcomes. Entries below say which matter
// most per statement and what artefacts satisfy them.
const EV_CQC = {
  S1: { looks: 'How concerns, incidents and near-misses are reported, investigated without blame, and turned into change. CQC triangulates staff feedback (do people speak up?), your processes (incident system, investigation records) and outcomes (did practice actually change?).',
        ev: 'Incident log with investigation notes and closure dates; theme analysis presented at governance meetings with the resulting action; staff who can describe a change made after an incident; near-miss entries (their presence is evidence of culture — an empty near-miss log is a red flag, not a clean sheet); duty of candour letters where triggered.',
        flags: 'Incidents recorded but never analysed; the same incident type recurring with no intervention; staff unaware of what changed after events; near-misses absent from records.' },
  S2: { looks: 'Safety across joins: referrals in, hospital admissions/discharges, transitions between services. Partners’ feedback and your process records carry weight here.',
        ev: 'Pre-admission assessments completed before service start; hospital passports current; discharge information acted on with dated care plan updates; evidence of information shared with (and received from) CMHT/GP at each transition.',
        flags: 'People arriving before assessment; hospital passports out of date; discharge summaries filed but plans unchanged.' },
  S3: { looks: 'Whether staff recognise abuse and act: referrals made to the LA without delay, CQC notified, people protected during enquiries. Tested by interviewing staff and cross-checking your referral log against LA and CQC records.',
        ev: 'Safeguarding log where every entry shows LA referral date + CQC notification date; staff who can name abuse types AND the external routes (LA, CQC, police) unprompted — the exact point Wingate failed on C04; body-map/records where relevant; lessons-shared evidence after concerns.',
        flags: 'Referral log and LA records not matching; staff who would only "tell the manager"; notifications made late or missed.' },
  S4: { looks: 'Positive risk-taking WITH the person rather than blanket restriction. People’s experience and processes are triangulated: does the risk assessment match the life the person actually lives?',
        ev: 'Risk assessments that are person-specific, RAG-rated, linked to care plans (the Wingate A08 strength) and reviewed after incidents; records of the person’s involvement in risk decisions; enabling decisions documented (what the person is supported TO do, not just prevented from).',
        flags: 'Identical generic assessments across people; restrictions with no capacity/best-interests basis; assessments not updated after events.' },
  S5: { looks: 'Premises and equipment safety in fact, not on paper: certificates, servicing, fire precautions, and whether defects get fixed. Observation plus process records.',
        ev: 'The full certificate set in date (gas, EICR, legionella regime, alarm/EML/extinguisher servicing); FRA actions closed with dates; PEEPs matching current mobility; defect log with the landlord chase trail in writing — the evidence the PAMMS assessor explicitly requested at E03.',
        flags: 'Any lapsed certificate; FRA actions open without dates; hazards visible on the walk-round that appear in no log.' },
  S6: { looks: 'Enough of the right staff, recruited safely, trained, supervised. Processes (files, rotas vs commissioned hours, training matrix) plus staff feedback.',
        ev: 'Sampled staff files passing every Schedule 3 element; rotas demonstrably matching assessed hours; training matrix with dates not ticks; supervision and appraisal on cycle; agency profiles verified before shifts.',
        flags: 'DBS gaps or post-start checks; unexplained employment gaps; matrix "compliance" that certificates cannot back up; supervision drift.' },
  S7: { looks: 'IPC as practised: clean environments, trained staff, PPE in use. Heavily observation-led with process support.',
        ev: 'Observed hand hygiene and PPE use; cleaning schedules signed in real time; IPC audits with actions closed; staff describing outbreak steps.',
        flags: 'Schedules signed ahead of time; PPE stored but not used; IPC training done with practice visibly contrary.' },
  S8: { looks: 'Medicines across the cycle: storage, administration, records, review — and whether staff know what they’re doing with PRN. Processes, observation, outcomes (error trends).',
        ev: 'Clean MAR sampling; temperature logs in range; PRN protocols staff can describe unprompted (the Wingate C07 failure); annual observed competencies; error log with learning; medication reviews with the prescriber evidenced.',
        flags: 'MAR gaps; protocols that exist but staff don’t know; competencies as e-learning only; errors unreported or unanalysed.' },
  E1: { looks: 'Whether needs — including communication needs and protected characteristics — are properly assessed and kept current.',
        ev: 'Assessments covering health, care, communication (AIS compliance), culture and relationships; updates dated after change; the person’s and family’s contribution visible.',
        flags: 'Assessment frozen at admission; communication needs identified but no accessible materials in use.' },
  E2: { looks: 'Care that follows recognised good practice for this population: PBS, STOMP, IDDSI, NICE where relevant.',
        ev: 'PBS plans for behaviours of concern; psychotropic review records (STOMP); SALT guidance visibly followed at mealtimes; practice referenced to guidance in plans.',
        flags: 'Restrictions instead of PBS; psychotropics unreviewed; IDDSI levels in the plan but not in the kitchen.' },
  E3: { looks: 'Joint working that functions: information flowing between your team, health professionals and families. Partner feedback matters here — CQC may phone the CMHT.',
        ev: 'Records of professional visits and what changed after; CPN/GP contact logs (the Wingate A15/B13 strength); MDT meeting notes; families reporting they’re kept informed.',
        flags: 'Professionals’ advice recorded but not enacted; partners describing you as hard to reach.' },
  E4: { looks: 'Support to live healthier lives: annual health checks, screening, health action plans, informed lifestyle choice (not imposed).',
        ev: 'Annual health check completion for people with LD; health action plans current; screening uptake supported and recorded; healthy-choice support that respects capacity (the A18/B22 pattern Wingate rated Good).',
        flags: 'Missed annual checks; health appointments unattended without follow-up; "choice" used to explain neglect of health needs.' },
  E5: { looks: 'Outcomes measured and improving — the statement that separates Good from Outstanding. What is better in people’s lives because of your support, with evidence.',
        ev: 'Per-person goals with dated progress; skills gained, community access, admissions avoided — counted; outcome summaries feeding governance; before/after examples you can narrate with records.',
        flags: 'Goals set but never revisited; "settled" as the only outcome claimed.' },
  E6: { looks: 'MCA in daily practice: capacity assumed, decision-specific assessment where indicated, best-interests done properly — and staff who can explain it. In supported living, deprivation of liberty needs Court of Protection authorisation (community DoL), not DoLS — inspectors notice teams who say "DoLS" here.',
        ev: 'Decision-specific capacity assessments; best-interests records naming consultees; consent practice observable (knock-and-wait — Wingate B06); staff articulating the five principles (the C02 gap); CoP applications where the acid test is met.',
        flags: 'Blanket capacity statements; restrictions with no legal basis; staff MCA knowledge limited to the training certificate.' },
  C1: { looks: 'Kindness and dignity as observed fact and as people describe it. Observation and people’s experience dominate.',
        ev: 'Interactions observed warm and unhurried; respectful language in daily notes (sampled); people saying they’re treated well in their own words (the Wingate B01 evidence).',
        flags: 'Task-focused interactions; infantilising or judgemental note language; staff talking over people.' },
  C2: { looks: 'People treated as individuals — culture, faith, identity, relationships honoured in practice, not just recorded.',
        ev: 'Plans reflecting identity and preferences with practice to match (food, worship, relationships supported); protected characteristics handled with confidence.',
        flags: 'Identical daily lives regardless of preference; cultural needs recorded then ignored.' },
  C3: { looks: 'Independence, choice and control: people doing things for themselves, real options, advocacy offered.',
        ev: 'Support plans built around what the person does themselves (the A08 self-care emphasis); choices visible in daily records; advocacy referrals where voice needs support.',
        flags: 'Staff doing "for" not "with"; choices offered from a menu of one.' },
  C4: { looks: 'Immediate needs answered: distress, pain and anxiety noticed and responded to quickly.',
        ev: 'Daily notes showing prompt response to distress with what worked; PRN-for-distress used within protocol and reviewed; staff describing individual early-warning signs.',
        flags: 'Distress recorded without response; escalation only after crisis.' },
  C5: { looks: 'Workforce wellbeing: supported staff deliver compassionate care. Staff feedback is the evidence category.',
        ev: 'Supervision that discusses wellbeing; debriefs after incidents; staff survey with actions; turnover and sickness understood and worked on.',
        flags: 'Burnt-out accounts in interviews; incidents without debrief; exit patterns unexamined.' },
  R1: { looks: 'Person-centred care: the plan is the person’s and changes when they change — and staff know it without reading it in front of the inspector.',
        ev: 'Plans in the person’s voice with their involvement evidenced (signatures — Wingate A04); updates within days of changed need; staff answering person-specific questions accurately.',
        flags: 'Plans describing a service not a person; staff unfamiliar with content; reviews that change nothing.' },
  R2: { looks: 'Continuity and coordination: consistent staffing, smooth handoffs, one coherent picture of the person across services.',
        ev: 'Rota continuity for each person; handover records; coordinated appointments with outcomes fed back into plans.',
        flags: 'Rotating unfamiliar staff for people who need consistency; information lost between shifts.' },
  R3: { looks: 'Information people can actually use — the Accessible Information Standard is a legal duty for adult social care.',
        ev: 'Easy-read tenancy, guide, complaints route (the Wingate A02 evidence); communication formats recorded and used; interpreters where needed.',
        flags: 'Standard-print-only documents for people who cannot use them; AIS needs unidentified.' },
  R4: { looks: 'Listening and involving: feedback invited, acted on, and the loop closed visibly.',
        ev: 'Surveys/feedback with actions AND you-said-we-did shared back (the F04 recommendation: document it and send to families); complaints log with learning; people confirming they are heard (B03).',
        flags: 'Feedback collected into a drawer; complaints resolved with no change; "no complaints" presented as strength without evidence people know how.' },
  R5: { looks: 'Equity in access: people get services when needed, including out of hours and urgent health access.',
        ev: 'Out-of-hours arrangements that worked (dated examples); escalation to GP/111/999 timely in records; barriers (transport, communication) actively managed.',
        flags: 'Delayed healthcare access; out-of-hours failures; access depending on staff goodwill rather than system.' },
  R6: { looks: 'Equity in experience and outcome — no group faring worse; barriers found and removed.',
        ev: 'Outcomes considered across the people you support; adjustments for communication, culture, disability documented and working; LeDeR learning applied where relevant.',
        flags: 'One person’s poorer experience explained away; no curiosity about differential outcomes.' },
  R7: { looks: 'Planning for the future: transitions, changing needs, and (where appropriate) end-of-life wishes explored sensitively.',
        ev: 'Future-planning conversations recorded with the person/family; transition plans for service moves; advance wishes documented where the person engaged with the topic.',
        flags: 'Future needs unconsidered until crisis; end-of-life topic avoided entirely for an ageing population.' },
  W1: { looks: 'Shared direction and culture: values staff can state and are seen to live. Staff feedback plus observation.',
        ev: 'Staff across roles describing the same priorities unprompted; values visible in decisions (recruitment questions, supervision themes); a positive, open feel the inspector senses on the day.',
        flags: 'Leaders’ narrative contradicted by floor staff; values on the wall only.' },
  W2: { looks: 'Capable, visible leadership: RM in post, known to people and staff, decisions traceable.',
        ev: 'RM registration current; leadership visits/walkthroughs logged with actions (your Management Walkthroughs board); staff saying leaders are accessible and act.',
        flags: 'Prolonged RM vacancy; leaders unknown at the houses; issues raised repeatedly without response.' },
  W3: { looks: 'Freedom to speak up: staff raise concerns without fear and something happens.',
        ev: 'Whistleblowing policy known (staff can name external routes — CQC, prescribed persons); speak-up instances handled well; no settlement gagging safeguarding matters (the Wingate C15/F05 pattern rated Good).',
        flags: 'Fear in interviews; concerns raised then punished or vanished.' },
  W4: { looks: 'Workforce equality and inclusion in substance: fair treatment, development for all, EDI beyond a policy.',
        ev: 'Fair progression evidence; adjustments for staff who need them; sponsorship/visa workers treated lawfully and fairly; EDI actions with dates.',
        flags: 'Concentration of concerns among one group; discriminatory rota or task patterns.' },
  W5: { looks: 'Governance that actually governs: audit cycle running, actions closing, data reaching decisions, statutory duties (notifications, PIR, DoC) flawless. The heaviest process-evidence statement.',
        ev: 'Audit calendar executed with closed actions (the F11 fix); governance minutes showing data → decision → follow-up; notifications cross-checked complete; PIR submitted well; risk register live.',
        flags: 'Audits done but actions open; the same finding across cycles; notification gaps — the single fastest route to enforcement.' },
  W6: { looks: 'Partnerships: open working with commissioners, safeguarding boards, health, families, community.',
        ev: 'Provider forum attendance; commissioner quality visits with actions closed (F08 evidence pattern); joint working records (police, social workers, housing — as Wingate evidenced); community links per person.',
        flags: 'Defensive posture with the LA; partners learning of incidents late.' },
  W7: { looks: 'Learning, improvement and innovation as habit: the service can show what it changed, why, and what improved.',
        ev: 'An improvement log with before/after; external learning imported (LeDeR, safety alerts, peer review); pilots evaluated honestly.',
        flags: 'Improvement claimed without artefacts; alerts unread; the service identical to last inspection with the same weaknesses.' },
  W8: { looks: 'Environmental sustainability: sensible, proportionate steps — CQC asks, weight is modest for small providers.',
        ev: 'Waste and recycling arrangements; energy measures in homes; travel choices considered; anything measured, however small.',
        flags: 'Nothing considered at all; claims with no substance.' },
};

// Wingate Walk precedent — the assessor's real findings, keyed by PAMMS code
function pammsPrecedent(code) {
  const w = MA_AUDITS.find(a => a.id === 'ma_wingate');
  const r = w?.ratings?.[code];
  if (!r || !r.note) return null;
  return { rating: r.r, note: r.note };
}

// Build the lens panel for any framework/standard — returns '' when nothing factual to show
function assessorLens(fw, st) {
  if (fw === 'cqc' && EV_CQC[st.c]) {
    const e = EV_CQC[st.c];
    return `<div style="margin:8px 0 2px 44px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:11px 14px;font-size:11.5px;line-height:1.7;color:var(--t2);">
      <div style="font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;">What the inspector examines</div>${esc(e.looks)}
      <div style="font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--grn);margin:9px 0 5px;">Strong evidence</div>${esc(e.ev)}
      <div style="font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--red);margin:9px 0 5px;">Red flags</div>${esc(e.flags)}
      <div style="font-size:9.5px;color:var(--t4);margin-top:8px;">Grounded in CQC’s published Single Assessment Framework (six evidence categories: people’s experience · staff & leader feedback · partner feedback · observation · processes · outcomes) — paraphrased guidance, not CQC’s verbatim text.</div>
    </div>`;
  }
  if (fw === 'pamms') {
    const p = pammsPrecedent(st.c);
    if (p) {
      const rm = SCALE_PAMMS[p.rating] || {};
      return `<div style="margin:8px 0 2px 44px;background:var(--paper);border:1px solid var(--line);border-left:3px solid ${rm.color || 'var(--gold)'};border-radius:0 8px 8px 0;padding:11px 14px;font-size:11.5px;line-height:1.7;color:var(--t2);">
        <div style="font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:${rm.color || 'var(--gold)'};margin-bottom:5px;">Real precedent — Wingate Walk, 20 May 2026 · assessor rated: ${rm.label || '—'}</div>
        <strong style="color:var(--t2);">What the assessor recorded:</strong> ${esc(p.note)}
        <div style="font-size:9.5px;color:var(--t4);margin-top:8px;">Verbatim substance of the PAMMS South East assessment of this exact standard at your own service — the most factual guide to what this assessor accepts${p.rating === 'RI' || p.rating === 'P' ? ', and what falls short' : ''}.</div>
      </div>`;
    }
    return '';
  }
  return '';
}

// ═══════════════════════════════════════════════════════════════
// STAFF JOURNEY — recruitment → checks → training → induction → staff
// Wizard flow with hard gates + a sky view of everyone at once

let PEOPLE = JSON.parse(localStorage.getItem('lc_people') || '[]');
function persistPeople() {
  try { localStorage.setItem('lc_people', JSON.stringify(PEOPLE)); } catch (e) {}
  if (typeof syncStatePush === 'function') syncStatePush();
}

function addMonths(iso, m) {
  const d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() + m);
  return d.toISOString().slice(0, 10);
}
function trainCurrency(person, mod) {
  const rec = person.training?.[mod.id];
  if (rec?.na) return { k: 'na', label: 'n/a', color: 'var(--t4)' };
  if (!rec?.date) return { k: 'nodate', label: '⛔ no date', color: 'var(--red)' };
  if (mod.cy === null) return { k: 'current', label: '✓ ' + fD(rec.date), color: 'var(--grn)', renew: null };
  const renew = addMonths(rec.date, mod.cy);
  const d = daysUntil(renew);
  if (d === null || d < 0) return { k: 'expired', label: '⛔ expired ' + fD(renew), color: 'var(--red)', renew };
  if (d <= 60) return { k: 'due', label: '🟠 renew by ' + fD(renew), color: 'var(--amb)', renew };
  return { k: 'current', label: '✓ until ' + fD(renew), color: 'var(--grn)', renew };
}
function trainStats(person) {
  let cur = 0, due = 0, bad = 0;
  TRAIN_MODULES.filter(m => m.core).forEach(m => {
    const s = trainCurrency(person, m).k;
    if (s === 'current') cur++; else if (s === 'due') due++; else if (s !== 'na') bad++;
  });
  return { cur, due, bad };
}
function journeyTrainDate(pid, mid, title) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  const rec = p.training?.[mid] || {};
  openModal(esc(title), `
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);">Completed on (from the certificate)</label>
    <input id="jtDate" type="date" value="${rec.date || ''}" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;margin:5px 0 11px;">
    <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3);"><input id="jtNa" type="checkbox" ${rec.na ? 'checked' : ''}> Not applicable to this role/person</label>
  `, `
    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="saveJourneyTrainDate('${pid}','${mid}')">Save</button>
  `);
}
function saveJourneyTrainDate(pid, mid) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  if (!p.training) p.training = {};
  const date = document.getElementById('jtDate')?.value || '';
  const na = !!document.getElementById('jtNa')?.checked;
  p.training[mid] = na ? { na: true } : (date ? { date } : {});
  persistPeople(); closeModal(); render();
}

function journeySteps(stageKey) { return JOURNEY_PHASES.filter(p => p.stage === stageKey).flatMap(p => p.steps); }
function stepDone(person, id) { const s = person.steps?.[id]; return s?.done || s?.na; }
function stageProgress(person, stageKey) {
  const steps = journeySteps(stageKey);
  if (!steps.length) return { done: 0, total: 0, pct: 100 };
  const done = steps.filter(s => stepDone(person, s.id)).length;
  return { done, total: steps.length, pct: Math.round(done / steps.length * 100) };
}
function stageIndex(k) { return JOURNEY_STAGES.findIndex(s => s.key === k); }
function gateOpen(person) { return stageProgress(person, person.stage).pct === 100; }

function addJourneyPerson() {
  openModal('New person — start the journey', `
    <input id="jpName" placeholder="Full name" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;margin-bottom:9px;">
    <input id="jpRole" placeholder="Role (e.g. Support Worker FT)" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;margin-bottom:9px;">
    <select id="jpHouse" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;background:white;margin-bottom:9px;">
      ${[...MA_HOUSES, 'Head office', 'TBC'].map(h => `<option>${h}</option>`).join('')}
    </select>
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);">Target start date</label>
    <input id="jpStart" type="date" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;">
  `, `
    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="createJourneyPerson()">Begin journey →</button>
  `);
}
function createJourneyPerson() {
  const name = document.getElementById('jpName')?.value?.trim();
  if (!name) { toast('Name needed'); return; }
  const p = { id: 'jp_' + Date.now(), name, role: document.getElementById('jpRole')?.value?.trim() || '—',
    house: document.getElementById('jpHouse')?.value || 'TBC', startDate: document.getElementById('jpStart')?.value || null,
    stage: 'recruit', steps: {}, ts: new Date().toISOString() };
  PEOPLE.unshift(p); persistPeople(); closeModal(); nav('induct', { jp: p.id });
}

function toggleJourneyStep(pid, sid) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  if (!p.steps[sid]) p.steps[sid] = {};
  const s = p.steps[sid];
  if (!s.done && !s.na) { s.done = true; s.dt = new Date().toISOString().slice(0, 10); }
  else if (s.done) { s.done = false; s.na = true; }
  else { delete p.steps[sid]; }
  persistPeople(); render();
}

function journeyStepNote(pid, sid, title) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  const s = p.steps[sid] || {};
  openModal(esc(title), `
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);">Key date (DBS issue / expiry / completion)</label>
    <input id="jsDate" type="date" value="${s.keyDate || ''}" style="width:100%;padding:9px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:13px;margin:5px 0 11px;">
    <label style="font-size:9.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);">Evidence note</label>
    <textarea id="jsNote" style="width:100%;min-height:90px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:var(--r3);font-size:12.5px;margin-top:5px;">${esc(s.note || '')}</textarea>
  `, `
    <button class="btn btn-sec btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-prim btn-sm" onclick="saveJourneyStepNote('${pid}','${sid}')">Save</button>
  `);
}
function saveJourneyStepNote(pid, sid) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  if (!p.steps[sid]) p.steps[sid] = {};
  p.steps[sid].keyDate = document.getElementById('jsDate')?.value || '';
  p.steps[sid].note = document.getElementById('jsNote')?.value || '';
  persistPeople(); closeModal(); render();
}

function advanceJourney(pid) {
  const p = PEOPLE.find(x => x.id === pid); if (!p) return;
  if (!gateOpen(p)) { toast('🔒 The gate is locked — complete every step first'); return; }
  const i = stageIndex(p.stage);
  if (i < JOURNEY_STAGES.length - 1) {
    p.stage = JOURNEY_STAGES[i + 1].key;
    p['entered_' + p.stage] = new Date().toISOString().slice(0, 10);
    persistPeople(); render();
    toast(p.stage === 'prestart' ? 'Into checks & pre-start training' : p.stage === 'induction' ? '✅ CLEARED TO START — induction begins' : '🛡 Confirmed in post — welcome to the team');
  }
}
function deleteJourneyPerson(pid) {
  if (!confirm('Remove this person from the journey tracker?')) return;
  PEOPLE = PEOPLE.filter(x => x.id !== pid); persistPeople(); nav('induct');
}

function journeySummaryLine() {
  const inflight = PEOPLE.filter(p => p.stage !== 'confirmed');
  const blocked = inflight.map(p => ({ p, prog: stageProgress(p, p.stage) })).filter(x => x.prog.total - x.prog.done > 0);
  const tbad = PEOPLE.filter(p => p.stage === 'confirmed').reduce((a, p) => a + trainStats(p).bad, 0);
  return `STAFF JOURNEY: ${inflight.length} in flight · ${PEOPLE.filter(p=>p.stage==='confirmed').length} confirmed · ${tbad} core training modules expired/undated across confirmed staff. Outstanding: ${blocked.map(x => `${x.p.name} (${x.p.stage}: ${x.prog.total - x.prog.done} steps left${x.p.startDate ? ', starts ' + x.p.startDate : ''})`).join(' | ') || 'none'}`;
}

// ═══ RENDER ═══
function renderInduct(m) {
  seedJourney();
  const pid = curState.jp;
  const person = PEOPLE.find(p => p.id === pid);
  if (person) { renderJourneyWizard(m, person); return; }
  renderJourneySky(m);
}

function ringDiv(pct, size, color) {
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${color} ${pct * 3.6}deg, var(--line) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <div style="width:${size - 8}px;height:${size - 8}px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-size:${size > 40 ? 12 : 9.5}px;font-weight:800;color:var(--t2);">${pct}%</div></div>`;
}

function renderJourneySky(m) {
  const inflight = PEOPLE.filter(p => p.stage !== 'confirmed');
  const confirmed = PEOPLE.filter(p => p.stage === 'confirmed');
  const soonStarts = inflight.filter(p => p.startDate && daysUntil(p.startDate) !== null && daysUntil(p.startDate) <= 14 && daysUntil(p.startDate) >= 0);
  const atRisk = inflight.filter(p => p.startDate && daysUntil(p.startDate) !== null && daysUntil(p.startDate) <= 14 && !gateOpen(p) && p.stage === 'prestart');
  const totalOutstanding = inflight.reduce((a, p) => { const pr = stageProgress(p, p.stage); return a + (pr.total - pr.done); }, 0);

    <div class="kpi am"><div class="kpi-label">Steps outstanding</div><div class="kpi-val">${totalOutstanding}</div><div class="kpi-note">across everyone</div></div>
    ${(function(){ const bad = confirmed.reduce((a, p) => a + trainStats(p).bad, 0); return `<div class="kpi ${bad ? 'rd' : 'gr'}"><div class="kpi-label">Training gaps</div><div class="kpi-val">${bad}</div><div class="kpi-note">expired / no date · ${confirmed.length} staff</div></div>`; })()}
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">
    <button class="btn btn-gold" onclick="addJourneyPerson()">+ New person</button>
    <div style="flex:1;"></div>
    ${CONN.aiKey && inflight.length ? `<button class="btn btn-sec btn-sm" onclick="askDock('Look at the staff journey: who is blocked, whose start date is at risk, and exactly what should we chase today?')">✦ Who do we chase?</button>` : ''}
  </div>
  <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;">
    ${JOURNEY_STAGES.slice(0, 3).map(st => {
      const list = PEOPLE.filter(p => p.stage === st.key);
      return `<div style="min-width:270px;flex:1;">
        <div style="font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);padding:0 4px 9px;display:flex;justify-content:space-between;">
          <span>${st.icon} ${st.label}</span><span>${list.length}</span></div>
        ${list.map(p => {
          const pr = stageProgress(p, p.stage);
          const du = p.startDate ? daysUntil(p.startDate) : null;
          const left = pr.total - pr.done;
          return `<div onclick="nav('induct',{jp:'${p.id}'})" style="background:white;border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border 0.15s;" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--line)'">
            <div style="display:flex;gap:11px;align-items:center;">
              ${ringDiv(pr.pct, 44, pr.pct === 100 ? 'var(--grn)' : left && du !== null && du <= 14 ? 'var(--red)' : 'var(--gold)')}
              <div style="flex:1;min-width:0;">
                <div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
                <div style="font-size:10.5px;color:var(--t3);">${esc(p.role)} · ${esc(p.house)}</div>
              </div>
            </div>
            <div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;">
              ${pr.pct === 100 ? '<span class="pill gr">✓ gate open — advance</span>' : `<span class="pill ${du !== null && du <= 14 ? 'rd' : 'am'}">${left} step${left===1?'':'s'} to the gate</span>`}

            </div>
          </div>`;
        }).join('') || '<div style="font-size:11.5px;color:var(--t4);padding:14px 6px;">Nobody at this stage</div>'}
      </div>`;
    }).join('')}
  </div>
  <div class="card mt-4">

    </div>

}

  m.innerHTML = bc('People', `${esc(p.name)}`, `${esc(p.role)} · ${esc(p.house)}${p.startDate ? ' · starts ' + fD(p.startDate) + (du !== null ? ` (${du < 0 ? Math.abs(du) + ' days ago' : du + ' days'})` : '') : ''}`) +

      ${ringDiv(pr.pct, 54, pr.pct === 100 ? 'var(--grn)' : 'var(--gold)')}
      <div style="flex:1;">
        <div style="font-family:var(--serif);font-size:16px;">${pr.pct === 100 ? 'Gate open — every step complete' : `🔒 Gate locked — ${pr.total - pr.done} of ${pr.total} steps remain`}</div>
        <div style="font-size:11.5px;color:var(--t3);margin-top:2px;">${p.stage === 'prestart' ? 'Nobody works a first shift until this gate opens — Schedule 3 + pre-start training, no exceptions.' : p.stage === 'induction' ? 'Confirmation requires the full 12-week record — shadow shifts and observed competencies signed.' : 'Complete recruitment to move into checks.'}</div>
      </div>
      <button class="btn ${pr.pct === 100 ? 'btn-gold' : 'btn-sec'}" ${pr.pct === 100 ? '' : 'disabled style="opacity:0.45;cursor:not-allowed;"'} onclick="advanceJourney('${p.id}')">${idx === 1 ? 'CLEAR TO START →' : idx === 2 ? 'CONFIRM IN POST →' : 'Advance →'}</button>
    </div>
  </div>`}

  ${JOURNEY_PHASES.map(ph => {
    const active = ph.stage === p.stage;
    const done = ph.steps.filter(s => stepDone(p, s.id)).length;
    const past = stageIndex(ph.stage) < idx;
    return `<details ${active ? 'open' : ''} class="card mb-3" style="${past ? 'opacity:0.82;' : ''}">
      <summary style="cursor:pointer;list-style:none;padding:13px 18px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:13.5px;font-weight:700;flex:1;">${esc(ph.name)}</span>
        <span class="pill ${done === ph.steps.length ? 'gr' : active ? 'am' : 'gy'}">${done}/${ph.steps.length}</span>
      </summary>
      ${ph.steps.map(s => {
        const st = p.steps[s.id] || {};
        return `<div style="padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;${st.done || st.na ? 'opacity:0.78;' : ''}">
          <div onclick="toggleJourneyStep('${p.id}','${s.id}')" title="done → n/a → clear" style="width:23px;height:23px;border-radius:50%;border:2px solid ${st.done ? 'var(--grn)' : st.na ? 'var(--t4)' : 'var(--line2)'};background:${st.done ? 'var(--grn)' : st.na ? 'var(--t4)' : 'white'};color:white;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;">${st.done ? '✓' : st.na ? '–' : ''}</div>
          <div style="flex:1;">
            <div style="font-size:12.5px;font-weight:600;">${esc(s.t)}</div>
            ${s.d ? `<div style="font-size:10.5px;color:var(--t3);margin-top:1px;">${esc(s.d)}</div>` : ''}
            ${st.note || st.keyDate ? `<div style="font-size:10.5px;color:var(--t3);margin-top:4px;background:var(--paper);border-left:2px solid var(--gold);padding:4px 8px;border-radius:0 5px 5px 0;">${st.keyDate ? `<strong>Key date:</strong> ${fD(st.keyDate)} · ` : ''}${esc(st.note || '')}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0;">
            ${st.dt ? `<span style="font-size:9.5px;color:var(--grn);font-weight:700;">✓ ${st.dt}</span>` : ''}
            <button onclick="journeyStepNote('${p.id}','${s.id}','${esc(s.t).replace(/'/g, '&#39;')}')" style="height:22px;padding:0 8px;border-radius:6px;border:1.5px solid ${st.note || st.keyDate ? 'var(--gold)' : 'var(--line2)'};background:${st.note || st.keyDate ? 'var(--gold-soft)' : 'white'};color:${st.note || st.keyDate ? 'var(--gold)' : 'var(--t4)'};font-size:10.5px;cursor:pointer;">✎ date/note</button>
          </div>
        </div>`;
      }).join('')}
    </details>`;
  }).join('')}

  <div class="card mb-3" style="border-color:var(--gold);">
    <div class="card-h"><div class="card-t">📆 Ongoing mandatory training — renewal clocks</div>
      ${(function(){ const ts = trainStats(p); return `<span class="pill ${ts.bad ? 'rd' : ts.due ? 'am' : 'gr'}" style="margin-left:auto;">${ts.cur} current · ${ts.due} due ≤60d · ${ts.bad} expired/no date</span>`; })()}
    </div>
    <div style="padding:8px 18px 4px;font-size:10.5px;color:var(--t4);">Dates come from certificates, never assumption — a module with no evidenced date counts as expired until the certificate date is entered. BLS and medication competency renew ANNUALLY; core modules 3-yearly.</div>
    ${TRAIN_MODULES.map(mod => {
      const cur = trainCurrency(p, mod);
      return `<div style="padding:9px 18px;border-top:1px solid var(--line);display:flex;gap:11px;align-items:center;${cur.k === 'na' ? 'opacity:0.55;' : ''}">
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${cur.color};flex-shrink:0;"></span>
        <div style="flex:1;font-size:12.5px;font-weight:600;">${esc(mod.t)}${mod.core ? '' : ' <span style="font-size:9.5px;color:var(--t4);font-weight:600;">person-specific</span>'}</div>
        <span style="font-size:11px;font-weight:700;color:${cur.color};">${cur.label}</span>
        <button onclick="journeyTrainDate('${p.id}','${mod.id}','${esc(mod.t).replace(/'/g, '&#39;')}')" style="height:22px;padding:0 8px;border-radius:6px;border:1.5px solid var(--line2);background:white;color:var(--t4);font-size:10.5px;cursor:pointer;">✎ date</button>
      </div>`;
    }).join('')}
  </div>`;
}

// Boot order: backend probe → Gmail session → state pull
async function bootSequence() {
  const hasBackend = await probeBackend();

}

// Restore the Gmail session on load — sign in once, stay signed in
function bootGmailSession() {
  if (CONN.gmailToken) {
    // Valid stored token — carry on, schedule its renewal
    scheduleGmailRefresh();
  } else if (CONN.googleClientId && localStorage.getItem('lc_gmail_granted')) {
    // Token expired while away — renew silently in the background
    silentGmailRefresh().then(ok => {
      updateConnDots();
      if (ok) { render(); gmailScan(15); toast('Gmail session restored ✓'); }
      else { render(); } // re-render so the one-click Resume button appears
    });
  }
}
bootSequence();
